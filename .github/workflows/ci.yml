name: CI

# Launch-window insurance: every push/PR runs the committed suites so a deploy
# is never guarded by discipline alone. Fast library layer first (Node's test
# runner, no browser), then the built-artifact smokes (Playwright + headless
# Chromium WebGL via SwiftShader). The slow examples-smoke (~9 min) stays manual.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── the fast layer: 7k+ library/engine tests, no browser (~30s) ──
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # app-export.test.js + update.test.js read build/auditable.html (a gitignored
      # build output) — npm test implicitly assumes a prior `node build.js`.
      - name: build auditable.html (tests read build/auditable.html)
        run: node build.js
      # --test-concurrency=1: serialize files so --test-force-exit (needed for
      # the worker-holding-the-loop test) only fires after the truly-last file
      # completes. In parallel on a 2-core runner it raced, cancelling a
      # still-running file's subtests ("did not finish before its parent").
      - name: library + engine tests (node --test)
        run: node --no-warnings --test --test-concurrency=1 --test-force-exit "test/!(adder-wasm).test.*"

  # ── the app-integration smokes: built artifacts in headless Chromium ──
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: install Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: build micro.html (the smoke boots the deploy artifact)
        run: node build.js --target=micro
      - name: micro smoke — features
        run: npm run test:micro
      - name: micro smoke 2 — data-integrity + persistence
        run: npm run test:micro2
      - name: micro host smoke — addLayer, load results, quoted CSV, Parquet sub-blocks, rotated models
        run: npm run test:micro:host
      - name: lamina built smoke — ship artifact + Sealed net gate
        run: node test/lamina-built-smoke.mjs
      - name: lamina host smoke — Parquet tables + window.lamina (dev tree + the built file)
        run: npm run test:lamina:host
      - name: condenser layer offsets — every pipeline, pick, section, resolve
        run: npm run test:condenser:offset
