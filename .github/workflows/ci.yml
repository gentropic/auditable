name: CI

# Every push/PR: the library layer (Node's test runner, no browser) plus the
# cheap built-artifact checks (does micro boot, is lamina still Sealed).
#
# The DRAWING smokes (micro-smoke, micro-smoke2, host, mobile, shell, wfr,
# structure, lamina host, condenser offsets) are NOT run here: the runner has no
# GPU, draws on SwiftShader, and micro switches itself into software-rendering
# mode there, so CI was testing the wrong path in ~2 h a run. They are a
# release gate run on a real GPU (a dev machine or the lab) before every
# release — see the release runbook. examples-smoke stays manual too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── the fast layer: 7k+ library/engine tests, no browser (~30s) ──
  library:
    runs-on: ubuntu-latest
    # a test file that holds the event loop open hangs the run; fail it instead
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # app-export.test.js + update.test.js read build/auditable.html (a gitignored
      # build output) — npm test implicitly assumes a prior `node build.js`.
      - name: build auditable.html (tests read build/auditable.html)
        run: node build.js
      # No --test-force-exit: every file exits on its own. Forcing the exit
      # crashed files on Windows (a libuv handle-closing assertion) and, in
      # parallel, cancelled still-running files. --test-concurrency=1 stays
      # from that era: serial on a 2-core runner has been reliably green.
      - name: library + engine tests (node --test)
        run: node --no-warnings --test --test-concurrency=1 "test/!(adder-wasm).test.*"

  # ── the built artifacts boot (packaging breaks), no drawing ──
  artifacts:
    # pinned: ubuntu-latest became 26.04, which Playwright's Chromium install
    # doesn't support yet (2026-10-28). Unpin when Playwright catches up.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: install Chromium (+ system deps)
        run: npx playwright install --with-deps chromium
      - name: build micro.html
        id: build
        run: node build.js --target=micro
      - name: micro import cycles — no load-time use between modules that import each other
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:micro:cycles
      - name: micro boots — built micro.html + the dev tree
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:micro:boot
      - name: lamina built smoke — ship artifact + Sealed net gate
        if: ${{ !cancelled() }}
        run: node test/lamina-built-smoke.mjs
