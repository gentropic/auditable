// DOM table grid — the editable task table, DOCKED above the gantt (a
// resizable split, not a floating window: the computed half of the grid —
// %, Start, Finish, Float, ◆ — was invisible in the old 780px float).
// The templates window stays floating (it's a side editor, not the surface).

function createTaskWindow() {                 // name kept — call sites predate the dock
  const existing = $('#pp-task-pane');
  if (existing) return existing;

  const pane = document.createElement('div');
  pane.id = 'pp-task-pane';
  pane.className = 'pp-task-pane';
  const saved = parseInt(localStorage.getItem('pp-grid-height') || '', 10);
  pane.style.height = (saved >= 80 ? saved : 220) + 'px';

  const body = document.createElement('div');
  body.className = 'pp-pane-body';
  body.id = 'pp-grid-wrap';
  pane.appendChild(body);

  // the split divider — drag to resize, double-click to fit the rows
  const divider = document.createElement('div');
  divider.className = 'pp-pane-divider';
  divider.title = 'drag to resize — Ctrl+E hides the task table';
  let dragging = false, startY = 0, startH = 0;
  divider.addEventListener('mousedown', e => {
    e.preventDefault();
    dragging = true; startY = e.clientY; startH = pane.offsetHeight;
    document.body.style.cursor = 'ns-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    pane.style.height = Math.max(80, Math.min(window.innerHeight - 160, startH + (e.clientY - startY))) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    localStorage.setItem('pp-grid-height', String(pane.offsetHeight));
  });
  divider.addEventListener('dblclick', () => {
    const want = Math.min(window.innerHeight - 160, body.scrollHeight + 8);
    pane.style.height = Math.max(80, want) + 'px';
    localStorage.setItem('pp-grid-height', String(pane.offsetHeight));
  });
  pane.appendChild(divider);

  const main = $('#pp-main');
  main.parentNode.insertBefore(pane, main);
  return pane;
}

function toggleTaskWindow() {
  const pane = $('#pp-task-pane');
  if (!pane) return;
  pane.classList.toggle('hidden');
}

function showTaskWindow() {
  const pane = $('#pp-task-pane');
  if (pane) pane.classList.remove('hidden');
}

function buildGrid() {
  const wrap = $('#pp-grid-wrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  loadColumnWidths();

  const table = document.createElement('table');
  table.className = 'pp-grid';

  // Header
  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  for (let ci = 0; ci < COLUMNS.length; ci++) {
    const col = COLUMNS[ci];
    const th = document.createElement('th');
    th.className = 'pp-col-' + (col.key === '#' ? 'num' : col.key === 'o' || col.key === 'm' || col.key === 'p' ? 'omp' : col.key);
    th.textContent = col.label;
    th.style.width = col.width + 'px';

    // Resize handle
    const handle = document.createElement('div');
    handle.className = 'pp-col-resize';
    handle.addEventListener('mousedown', colResizeStart(th, col, ci));
    handle.addEventListener('dblclick', e => { e.stopPropagation(); colAutoResize(th, col, ci); });
    th.appendChild(handle);

    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  // Body
  const tbody = document.createElement('tbody');
  tbody.id = 'pp-tbody';
  table.appendChild(tbody);

  wrap.appendChild(table);
  renderRows();
}

function colResizeStart(th, col, ci) {
  return function(e) {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX;
    const startW = th.offsetWidth;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';

    function onMove(ev) {
      const w = Math.max(24, startW + ev.clientX - startX);
      th.style.width = w + 'px';
      col.width = w;
    }

    function onUp() {
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      // Persist column widths
      saveColumnWidths();
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  };
}

function colAutoResize(th, col, ci) {
  const tbody = $('#pp-tbody');
  if (!tbody) return;

  // Measure header text
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font:inherit;padding:0 6px;';
  probe.textContent = col.label;
  th.appendChild(probe);
  let maxW = probe.offsetWidth + 12; // padding + resize handle
  th.removeChild(probe);

  // Measure all cells in this column
  const rows = tbody.querySelectorAll('tr[data-index]');
  for (const row of rows) {
    const cells = row.querySelectorAll('td');
    const cell = cells[ci];
    if (!cell) continue;
    probe.textContent = cell.textContent;
    document.body.appendChild(probe);
    const w = probe.offsetWidth + 4;
    document.body.removeChild(probe);
    if (w > maxW) maxW = w;
  }

  maxW = Math.max(24, Math.min(maxW, 400));
  th.style.width = maxW + 'px';
  col.width = maxW;
  saveColumnWidths();
}

function saveColumnWidths() {
  const widths = {};
  for (const col of COLUMNS) widths[col.key] = col.width;
  localStorage.setItem('pp-col-widths', JSON.stringify(widths));
}

function loadColumnWidths() {
  try {
    const saved = JSON.parse(localStorage.getItem('pp-col-widths'));
    if (!saved) return;
    for (const col of COLUMNS) {
      if (saved[col.key] != null) col.width = saved[col.key];
    }
  } catch (_) {}
}

function renderRows() {
  const tbody = $('#pp-tbody');
  if (!tbody) return;
  tbody.innerHTML = '';

  const scheduled = PP.scheduleResult ? PP.scheduleResult.scheduled : [];
  const schedMap = {};
  for (const s of scheduled) schedMap[s.id] = s;

  for (let i = 0; i < PP.tasks.length; i++) {
    const task = PP.tasks[i];
    const sched = schedMap[task.id];
    const tr = document.createElement('tr');
    tr.dataset.index = i;

    if (sched && sched.isCritical) tr.classList.add('pp-critical');
    if (i === PP.ui.selectedRow) tr.classList.add('pp-selected');
    const taskLinked = isLinkedTask(task);
    if (taskLinked) tr.classList.add('pp-linked-row');

    for (const col of COLUMNS) {
      const td = document.createElement('td');

      if (col.type === 'rownum') {
        td.className = 'pp-row-num';
        if (taskLinked) {
          const tpl = PP.templates.find(t => t.id === task._tpl);
          td.innerHTML = '<span class="pp-link-badge" title="Linked: ' + esc(tpl ? tpl.name : task._tpl) + '">\u25cf</span>' + (i + 1);
        } else {
          td.textContent = i + 1;
        }
        td.addEventListener('click', () => selectRow(i));
        td.addEventListener('contextmenu', e => showRowContextMenu(e, i));
      } else if (col.computed) {
        td.className = 'pp-computed';
        if (col.type === 'number') td.classList.add('pp-number');
        td.textContent = getComputedValue(task, col.key, sched);
        if (col.key === 'critical') td.className = 'pp-critical-icon pp-computed';
      } else {
        const linked = isLinkedTask(task) && isLinkedField(col.key);
        td.className = linked ? 'pp-editable pp-linked' : 'pp-editable';
        if (col.type === 'number') td.classList.add('pp-number');
        if (!linked) {
          td.contentEditable = 'true';
        }
        td.spellcheck = false;
        td.textContent = task[col.key] || '';
        td.dataset.col = col.key;
        td.dataset.row = i;

        td.addEventListener('focus', () => selectRow(i));
        if (!linked) {
          td.addEventListener('blur', e => onCellBlur(e, i, col.key));
          td.addEventListener('keydown', e => onCellKeydown(e, i, col.key));
        }
      }

      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }

  // Add row button
  const addTr = document.createElement('tr');
  const addTd = document.createElement('td');
  addTd.colSpan = COLUMNS.length;
  addTd.className = 'pp-add-row';
  addTd.textContent = '+ add task';
  addTd.addEventListener('click', () => {
    pushUndo();
    PP.tasks.push(createTask());
    renderRows();
    // Focus ID cell of new row
    const lastRow = PP.tasks.length - 1;
    focusCell(lastRow, 'id');
  });
  addTr.appendChild(addTd);
  tbody.appendChild(addTr);
}

function getComputedValue(task, key, sched) {
  if (!sched) return '';
  switch (key) {
    case 'start':
      return sched.earlyStart ? formatDate(sched.earlyStart) : '';
    case 'finish':
      return sched.earlyFinish ? formatDate(sched.earlyFinish) : '';
    case 'float':
      return sched.totalFloat != null ? String(Math.round(sched.totalFloat)) : '';
    case 'critical':
      return sched.isCritical ? '\u25c6' : '';
    default:
      return '';
  }
}

function formatDate(d) {
  if (!d) return '';
  const dt = d instanceof Date ? d : new Date(d);
  if (isNaN(dt)) return '';
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function selectRow(i) {
  PP.ui.selectedRow = i;
  // Update classes without full re-render
  const rows = $$('#pp-tbody tr');
  for (const r of rows) {
    const idx = parseInt(r.dataset.index);
    if (idx === i) r.classList.add('pp-selected');
    else r.classList.remove('pp-selected');
  }
  // Scroll Gantt to show the selected task (skip if editing a cell)
  const ae = document.activeElement;
  const editing = ae && ae.contentEditable === 'true' && ae.closest('#pp-tbody');
  if (!editing) {
    const task = PP.tasks[i];
    if (task && task.id) scrollGanttToTask(task.id);
  }
}

function scrollGridToRow(i) {
  const row = $(`#pp-tbody tr[data-index="${i}"]`);
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function focusCell(row, colKey) {
  requestAnimationFrame(() => {
    const cell = $(`#pp-tbody tr[data-index="${row}"] td[data-col="${colKey}"]`);
    if (cell) cell.focus();
  });
}

function onCellBlur(e, row, col) {
  const val = e.target.textContent.trim();
  const task = PP.tasks[row];
  if (!task) return;

  const oldVal = task[col] || '';
  if (val === oldVal) return;

  pushUndo();
  task[col] = val;
  PP.dirty = true;
  updateTitle();
  scheduleEval();
}

function onCellKeydown(e, row, col) {
  if (e.key === 'Enter') {
    e.preventDefault();
    e.target.blur();
    // Move to next row same column
    if (row + 1 < PP.tasks.length) {
      focusCell(row + 1, col);
    } else if (row + 1 === PP.tasks.length) {
      // Add new row
      pushUndo();
      PP.tasks.push(createTask());
      renderRows();
      focusCell(row + 1, col);
    }
    return;
  }

  if (e.key === 'Tab') {
    e.preventDefault();
    e.target.blur();
    const editableCols = COLUMNS.filter(c => c.editable);
    const idx = editableCols.findIndex(c => c.key === col);
    if (e.shiftKey) {
      if (idx > 0) focusCell(row, editableCols[idx - 1].key);
      else if (row > 0) focusCell(row - 1, editableCols[editableCols.length - 1].key);
    } else {
      if (idx < editableCols.length - 1) focusCell(row, editableCols[idx + 1].key);
      else if (row + 1 < PP.tasks.length) focusCell(row + 1, editableCols[0].key);
    }
    return;
  }

  if (e.key === 'Escape') {
    e.target.textContent = PP.tasks[row][col] || '';
    e.target.blur();
    return;
  }

  if (e.key === 'ArrowDown' && !e.target.textContent) {
    e.preventDefault();
    if (row + 1 < PP.tasks.length) focusCell(row + 1, col);
    return;
  }

  if (e.key === 'ArrowUp' && !e.target.textContent) {
    e.preventDefault();
    if (row > 0) focusCell(row - 1, col);
    return;
  }

  // Delete row with Ctrl+Delete
  if (e.key === 'Delete' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    deleteRow(row);
    return;
  }
}

function deleteRow(i) {
  if (i < 0 || i >= PP.tasks.length) return;
  pushUndo();
  PP.tasks.splice(i, 1);
  if (PP.ui.selectedRow >= PP.tasks.length) PP.ui.selectedRow = PP.tasks.length - 1;
  PP.dirty = true;
  updateTitle();
  renderRows();
  scheduleEval();
}

function insertRowAfter(i) {
  pushUndo();
  PP.tasks.splice(i + 1, 0, createTask());
  PP.dirty = true;
  updateTitle();
  renderRows();
  focusCell(i + 1, 'id');
}

function moveRow(from, to) {
  if (from === to || from < 0 || to < 0 || from >= PP.tasks.length || to >= PP.tasks.length) return;
  pushUndo();
  const [task] = PP.tasks.splice(from, 1);
  PP.tasks.splice(to, 0, task);
  PP.ui.selectedRow = to;
  PP.dirty = true;
  updateTitle();
  renderRows();
  scheduleEval();
}

function showRowContextMenu(e, row) {
  e.preventDefault();
  closeContextMenu();
  selectRow(row);

  const menu = document.createElement('div');
  menu.className = 'pp-context-menu';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';

  const items = [
    { label: 'Insert Row Above', action: () => { pushUndo(); PP.tasks.splice(row, 0, createTask()); PP.dirty = true; renderRows(); scheduleEval(); } },
    { label: 'Insert Row Below', action: () => insertRowAfter(row) },
    { label: 'Delete Row', action: () => deleteRow(row) },
  ];

  if (row > 0) {
    items.push({ label: 'Move Up', action: () => moveRow(row, row - 1) });
  }
  if (row < PP.tasks.length - 1) {
    items.push({ label: 'Move Down', action: () => moveRow(row, row + 1) });
  }
  if (isLinkedTask(PP.tasks[row])) {
    items.push({ label: 'Unlink from Template', action: () => unlinkTaskById(row) });
  }

  for (const item of items) {
    const btn = document.createElement('button');
    btn.className = 'pp-context-entry';
    btn.textContent = item.label;
    btn.addEventListener('click', () => { closeContextMenu(); item.action(); });
    menu.appendChild(btn);
  }

  document.body.appendChild(menu);

  // Keep in viewport
  const rect = menu.getBoundingClientRect();
  if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 4) + 'px';
  if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 4) + 'px';

  const dismiss = (ev) => {
    if (!menu.contains(ev.target)) {
      closeContextMenu();
      document.removeEventListener('click', dismiss);
    }
  };
  setTimeout(() => document.addEventListener('click', dismiss), 0);
}

function closeContextMenu() {
  const existing = $('.pp-context-menu');
  if (existing) existing.remove();
}

// Undo/redo

function pushUndo() {
  PP.undoStack.push(JSON.stringify({ tasks: PP.tasks, templates: PP.templates }));
  if (PP.undoStack.length > 50) PP.undoStack.shift();
  PP.redoStack = [];
}

function undo() {
  if (!PP.undoStack.length) return;
  PP.redoStack.push(JSON.stringify({ tasks: PP.tasks, templates: PP.templates }));
  const snap = JSON.parse(PP.undoStack.pop());
  PP.tasks = snap.tasks || snap;
  PP.templates = snap.templates || [];
  PP.dirty = true;
  updateTitle();
  renderRows();
  scheduleEval();
}

function redo() {
  if (!PP.redoStack.length) return;
  PP.undoStack.push(JSON.stringify({ tasks: PP.tasks, templates: PP.templates }));
  const snap = JSON.parse(PP.redoStack.pop());
  PP.tasks = snap.tasks || snap;
  PP.templates = snap.templates || [];
  PP.dirty = true;
  updateTitle();
  renderRows();
  scheduleEval();
}

// -- templates.js --

// Template editor — floating window for reusable task templates

const TPL_COLUMNS = [
  { key: '#',       label: '#',       width: 28,  type: 'rownum' },
  { key: 'id',      label: 'ID',      width: 70,  type: 'text',   editable: true },
  { key: 'name',    label: 'Name',    width: 180, type: 'text',   editable: true },
  { key: 'o',       label: 'O',       width: 45,  type: 'number', editable: true },
  { key: 'm',       label: 'M',       width: 45,  type: 'number', editable: true },
  { key: 'p',       label: 'P',       width: 45,  type: 'number', editable: true },
  { key: 'depends', label: 'Depends', width: 100, type: 'text',   editable: true },
  { key: 'resource',label: 'Resource',width: 80,  type: 'text',   editable: true },
];

function createTemplate(overrides) {
  return {
    id: 'tpl_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    name: 'New Template',
    tasks: [],
    ...overrides,
  };
}

function createTemplateTask(overrides) {
  return { id: '', name: '', o: '', m: '', p: '', depends: '', resource: '', ...overrides };
}

// ── Template window ──

function createTemplateWindow() {
  const existing = $('#pp-tpl-window');
  if (existing) return existing;

  const win = document.createElement('div');
  win.id = 'pp-tpl-window';
  win.className = 'pp-window hidden';

  const saved = localStorage.getItem('pp-tpl-win-pos');
  let pos = { left: 120, top: 100, width: 720, height: 420 };
  if (saved) {
    try { pos = JSON.parse(saved); } catch (_) {}
  }
  win.style.left = pos.left + 'px';
  win.style.top = pos.top + 'px';
  win.style.width = pos.width + 'px';
  win.style.height = pos.height + 'px';

  // Title bar
  const tb = document.createElement('div');
  tb.className = 'pp-win-tb';

  const title = document.createElement('span');
  title.className = 'pp-win-title';
  title.id = 'pp-tpl-title';
  title.textContent = 'TEMPLATES';
  tb.appendChild(title);

  const btns = document.createElement('div');
  btns.className = 'pp-win-btns';

  const minBtn = document.createElement('button');
  minBtn.className = 'pp-win-btn';
  minBtn.textContent = '\u2013';
  minBtn.title = 'Minimize';
  minBtn.addEventListener('click', () => win.classList.toggle('minimized'));
  btns.appendChild(minBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'pp-win-btn';
  closeBtn.textContent = '\u00d7';
  closeBtn.title = 'Close';
  closeBtn.addEventListener('click', () => toggleTemplateWindow());
  btns.appendChild(closeBtn);

  tb.appendChild(btns);
  win.appendChild(tb);

  // Body
  const body = document.createElement('div');
  body.className = 'pp-win-body';
  body.id = 'pp-tpl-body';
  win.appendChild(body);

  // Resize handle
  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'pp-win-resize';
  win.appendChild(resizeHandle);

  // Drag
  let dragging = false, dragX = 0, dragY = 0;
  tb.addEventListener('mousedown', e => {
    if (e.target.closest('.pp-win-btn')) return;
    e.preventDefault();
    dragging = true;
    dragX = e.clientX - win.offsetLeft;
    dragY = e.clientY - win.offsetTop;
    document.body.style.cursor = 'grabbing';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (dragging) {
      win.style.left = Math.max(0, e.clientX - dragX) + 'px';
      win.style.top = Math.max(0, e.clientY - dragY) + 'px';
    }
  });

  document.addEventListener('mouseup', () => {
    if (dragging) {
      dragging = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      saveTplWinPos(win);
    }
  });

  // Resize
  let resizing = false, resStartX = 0, resStartY = 0, resStartW = 0, resStartH = 0;
  resizeHandle.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    resizing = true;
    resStartX = e.clientX;
    resStartY = e.clientY;
    resStartW = win.offsetWidth;
    resStartH = win.offsetHeight;
    document.body.style.cursor = 'nwse-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (resizing) {
      win.style.width = Math.max(400, resStartW + e.clientX - resStartX) + 'px';
      win.style.height = Math.max(150, resStartH + e.clientY - resStartY) + 'px';
    }
  });

  document.addEventListener('mouseup', () => {
    if (resizing) {
      resizing = false;
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      saveTplWinPos(win);
    }
  });

  $('#pp-main').appendChild(win);
  return win;
}

function saveTplWinPos(win) {
  localStorage.setItem('pp-tpl-win-pos', JSON.stringify({
    left: win.offsetLeft,
    top: win.offsetTop,
    width: win.offsetWidth,
    height: win.offsetHeight,
  }));
}

function toggleTemplateWindow() {
  const win = createTemplateWindow();
  win.classList.toggle('hidden');
  if (!win.classList.contains('hidden')) renderTemplateList();
}

function showTemplateWindow() {
  const win = createTemplateWindow();
  win.classList.remove('hidden');
  renderTemplateList();
}

// ── Template list view ──

function renderTemplateList() {
  const body = $('#pp-tpl-body');
  if (!body) return;
  body.innerHTML = '';

  const titleEl = $('#pp-tpl-title');
  if (titleEl) titleEl.textContent = 'TEMPLATES';

  // Toolbar
  const toolbar = document.createElement('div');
  toolbar.className = 'pp-tpl-toolbar';

  const addBtn = document.createElement('button');
  addBtn.className = 'pp-tpl-action';
  addBtn.textContent = '+ new template';
  addBtn.addEventListener('click', () => {
    pushUndo();
    const tpl = createTemplate();
    tpl.tasks.push(createTemplateTask());
    PP.templates.push(tpl);
    PP.dirty = true;
    updateTitle();
    openTemplateEditor(tpl.id);
  });
  toolbar.appendChild(addBtn);
  body.appendChild(toolbar);

  if (!PP.templates.length) {
    const empty = document.createElement('div');
    empty.className = 'pp-tpl-empty';
    empty.textContent = 'No templates yet. Create one to define reusable task sequences.';
    body.appendChild(empty);
    return;
  }

  const list = document.createElement('div');
  list.className = 'pp-tpl-list';

  for (const tpl of PP.templates) {
    const entry = document.createElement('div');
    entry.className = 'pp-tpl-entry';

    const info = document.createElement('div');
    info.className = 'pp-tpl-info';
    info.addEventListener('click', () => openTemplateEditor(tpl.id));

    const name = document.createElement('span');
    name.className = 'pp-tpl-name';
    name.textContent = tpl.name;
    info.appendChild(name);

    const count = document.createElement('span');
    count.className = 'pp-tpl-count';
    const n = tpl.tasks.filter(t => t.id).length;
    count.textContent = n + ' task' + (n !== 1 ? 's' : '');
    info.appendChild(count);

    entry.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'pp-tpl-actions';

    const instBtn = document.createElement('button');
    instBtn.className = 'pp-tpl-action';
    instBtn.textContent = 'Instance';
    instBtn.title = 'Create tasks from this template';
    instBtn.addEventListener('click', e => { e.stopPropagation(); showInstanceDialog(tpl.id); });
    actions.appendChild(instBtn);

    const dupBtn = document.createElement('button');
    dupBtn.className = 'pp-tpl-action';
    dupBtn.textContent = 'Duplicate';
    dupBtn.title = 'Duplicate this template';
    dupBtn.addEventListener('click', e => {
      e.stopPropagation();
      pushUndo();
      const copy = createTemplate({
        name: tpl.name + ' (copy)',
        tasks: tpl.tasks.map(t => createTemplateTask(t)),
      });
      PP.templates.push(copy);
      PP.dirty = true;
      updateTitle();
      renderTemplateList();
    });
    actions.appendChild(dupBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'pp-tpl-action pp-tpl-danger';
    delBtn.textContent = '\u00d7';
    delBtn.title = 'Delete template';
    delBtn.addEventListener('click', e => {
      e.stopPropagation();
      if (!confirm('Delete template "' + tpl.name + '"?')) return;
      pushUndo();
      PP.templates = PP.templates.filter(t => t.id !== tpl.id);
      // Unlink any linked tasks
      for (const task of PP.tasks) {
        if (task._tpl === tpl.id) {
          unlinkTask(task, tpl);
        }
      }
      PP.dirty = true;
      updateTitle();
      renderTemplateList();
      renderRows();
      scheduleEval();
    });
    actions.appendChild(delBtn);

    entry.appendChild(actions);
    list.appendChild(entry);
  }

  body.appendChild(list);
}

// ── Template editor (single template) ──

function openTemplateEditor(tplId) {
  const tpl = PP.templates.find(t => t.id === tplId);
  if (!tpl) return;

  const body = $('#pp-tpl-body');
  if (!body) return;
  body.innerHTML = '';

  const titleEl = $('#pp-tpl-title');
  if (titleEl) titleEl.textContent = 'TEMPLATE: ' + tpl.name;

  // Back + name row
  const header = document.createElement('div');
  header.className = 'pp-tpl-header';

  const backBtn = document.createElement('button');
  backBtn.className = 'pp-tpl-action';
  backBtn.textContent = '\u2190 Back';
  backBtn.addEventListener('click', () => renderTemplateList());
  header.appendChild(backBtn);

  const nameInput = document.createElement('input');
  nameInput.className = 'pp-tpl-name-input';
  nameInput.type = 'text';
  nameInput.value = tpl.name;
  nameInput.spellcheck = false;
  nameInput.addEventListener('blur', () => {
    const v = nameInput.value.trim() || 'Unnamed';
    if (v !== tpl.name) {
      tpl.name = v;
      PP.dirty = true;
      updateTitle();
      if (titleEl) titleEl.textContent = 'TEMPLATE: ' + v;
      // Update linked tasks' template ref name
    }
  });
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });
  header.appendChild(nameInput);

  body.appendChild(header);

  // Task table
  const table = document.createElement('table');
  table.className = 'pp-grid pp-tpl-grid';

  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  for (const col of TPL_COLUMNS) {
    const th = document.createElement('th');
    th.className = 'pp-col-' + (col.key === '#' ? 'num' : col.key === 'o' || col.key === 'm' || col.key === 'p' ? 'omp' : col.key);
    th.textContent = col.label;
    th.style.width = col.width + 'px';
    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');

  for (let i = 0; i < tpl.tasks.length; i++) {
    const task = tpl.tasks[i];
    const tr = document.createElement('tr');
    tr.dataset.index = i;

    for (const col of TPL_COLUMNS) {
      const td = document.createElement('td');

      if (col.type === 'rownum') {
        td.className = 'pp-row-num';
        td.textContent = i + 1;
        td.addEventListener('contextmenu', e => showTplRowMenu(e, tplId, i));
      } else {
        td.className = 'pp-editable';
        if (col.type === 'number') td.classList.add('pp-number');
        td.contentEditable = 'true';
        td.spellcheck = false;
        td.textContent = task[col.key] || '';
        td.dataset.col = col.key;
        td.dataset.row = i;

        td.addEventListener('blur', () => {
          const val = td.textContent.trim();
          if (val !== (task[col.key] || '')) {
            task[col.key] = val;
            PP.dirty = true;
            updateTitle();
            propagateTemplateChange(tplId);
          }
        });

        td.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            td.blur();
            if (i + 1 < tpl.tasks.length) {
              tplFocusCell(tbody, i + 1, col.key);
            } else {
              tpl.tasks.push(createTemplateTask());
              PP.dirty = true;
              openTemplateEditor(tplId);
              requestAnimationFrame(() => {
                const newBody = body.querySelector('tbody');
                if (newBody) tplFocusCell(newBody, tpl.tasks.length - 1, col.key);
              });
            }
          }
          if (e.key === 'Escape') {
            td.textContent = task[col.key] || '';
            td.blur();
          }
          if (e.key === 'Tab') {
            e.preventDefault();
            td.blur();
            const editableCols = TPL_COLUMNS.filter(c => c.editable);
            const idx = editableCols.findIndex(c => c.key === col.key);
            if (e.shiftKey) {
              if (idx > 0) tplFocusCell(tbody, i, editableCols[idx - 1].key);
              else if (i > 0) tplFocusCell(tbody, i - 1, editableCols[editableCols.length - 1].key);
            } else {
              if (idx < editableCols.length - 1) tplFocusCell(tbody, i, editableCols[idx + 1].key);
              else if (i + 1 < tpl.tasks.length) tplFocusCell(tbody, i + 1, editableCols[0].key);
            }
          }
          if (e.key === 'Delete' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            if (tpl.tasks.length > 1) {
              tpl.tasks.splice(i, 1);
              PP.dirty = true;
              updateTitle();
              propagateTemplateChange(tplId);
              openTemplateEditor(tplId);
            }
          }
        });
      }

      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }

  // Add row
  const addTr = document.createElement('tr');
  const addTd = document.createElement('td');
  addTd.colSpan = TPL_COLUMNS.length;
  addTd.className = 'pp-add-row';
  addTd.textContent = '+ add task';
  addTd.addEventListener('click', () => {
    tpl.tasks.push(createTemplateTask());
    PP.dirty = true;
    updateTitle();
    openTemplateEditor(tplId);
    requestAnimationFrame(() => {
      const newBody = body.querySelector('tbody');
      if (newBody) tplFocusCell(newBody, tpl.tasks.length - 1, 'id');
    });
  });
  addTr.appendChild(addTd);
  tbody.appendChild(addTr);

  table.appendChild(tbody);
  body.appendChild(table);
}

function tplFocusCell(tbody, row, colKey) {
  requestAnimationFrame(() => {
    const cell = tbody.querySelector('tr[data-index="' + row + '"] td[data-col="' + colKey + '"]');
    if (cell) cell.focus();
  });
}

function showTplRowMenu(e, tplId, row) {
  e.preventDefault();
  closeContextMenu();

  const tpl = PP.templates.find(t => t.id === tplId);
  if (!tpl) return;

  const menu = document.createElement('div');
  menu.className = 'pp-context-menu';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';

  const items = [
    { label: 'Insert Row Above', action: () => { tpl.tasks.splice(row, 0, createTemplateTask()); PP.dirty = true; propagateTemplateChange(tplId); openTemplateEditor(tplId); } },
    { label: 'Insert Row Below', action: () => { tpl.tasks.splice(row + 1, 0, createTemplateTask()); PP.dirty = true; propagateTemplateChange(tplId); openTemplateEditor(tplId); } },
    { label: 'Delete Row', action: () => { if (tpl.tasks.length > 1) { tpl.tasks.splice(row, 1); PP.dirty = true; propagateTemplateChange(tplId); openTemplateEditor(tplId); } } },
  ];

  for (const item of items) {
    const btn = document.createElement('button');
    btn.className = 'pp-context-entry';
    btn.textContent = item.label;
    btn.addEventListener('click', () => { closeContextMenu(); item.action(); });
    menu.appendChild(btn);
  }

  document.body.appendChild(menu);

  const rect = menu.getBoundingClientRect();
  if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 4) + 'px';
  if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 4) + 'px';

  const dismiss = ev => {
    if (!menu.contains(ev.target)) {
      closeContextMenu();
      document.removeEventListener('click', dismiss);
    }
  };
  setTimeout(() => document.addEventListener('click', dismiss), 0);
}

// ── Instance dialog ──

function showInstanceDialog(tplId) {
  const tpl = PP.templates.find(t => t.id === tplId);
  if (!tpl) return;

  const overlay = document.createElement('div');
  overlay.className = 'pp-modal-overlay';
  overlay.innerHTML = '<div class="pp-modal">'
    + '<div class="pp-modal-title">Instance: ' + esc(tpl.name) + '</div>'
    + '<div class="pp-instance-form">'
    + '<label class="pp-inst-label">Prefix<input class="pp-inst-input" id="pp-inst-prefix" type="text" placeholder="e.g. a" spellcheck="false"></label>'
    + '<label class="pp-inst-label">Group Path<input class="pp-inst-input" id="pp-inst-group" type="text" placeholder="e.g. Deposit A/Exploration" spellcheck="false"></label>'
    + '<label class="pp-inst-label">Mode'
    + '<select class="pp-inst-input" id="pp-inst-mode">'
    + '<option value="linked">Linked (read-only params from template)</option>'
    + '<option value="detached">Detached (editable copy)</option>'
    + '</select></label>'
    + '</div>'
    + '<div class="pp-rename-actions">'
    + '<button class="pp-modal-close" data-action="cancel">Cancel</button>'
    + '<button class="pp-modal-close" data-action="ok">Create</button>'
    + '</div></div>';

  const finish = (accept) => {
    if (accept) {
      const prefix = overlay.querySelector('#pp-inst-prefix').value.trim();
      const group = overlay.querySelector('#pp-inst-group').value.trim();
      const mode = overlay.querySelector('#pp-inst-mode').value;

      if (!prefix) {
        setStatus('msg', 'prefix is required');
        return;
      }

      // Check for ID collisions
      const existing = new Set(PP.tasks.map(t => t.id));
      for (const tt of tpl.tasks) {
        if (tt.id && existing.has(prefix + '_' + tt.id)) {
          setStatus('msg', 'ID collision: ' + prefix + '_' + tt.id + ' already exists');
          return;
        }
      }

      pushUndo();
      instanceTemplate(tplId, prefix, group, mode);
      PP.dirty = true;
      updateTitle();
      renderRows();
      scheduleEval();
      setStatus('msg', 'instanced ' + tpl.name + ' (' + mode + ')');
    }
    overlay.remove();
  };

  overlay.addEventListener('click', e => {
    const action = e.target.dataset.action;
    if (action === 'ok') finish(true);
    else if (action === 'cancel') finish(false);
    else if (e.target === overlay) finish(false);
  });

  overlay.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });

  document.body.appendChild(overlay);
  requestAnimationFrame(() => {
    const inp = overlay.querySelector('#pp-inst-prefix');
    if (inp) inp.focus();
  });
}

function instanceTemplate(tplId, prefix, group, mode) {
  const tpl = PP.templates.find(t => t.id === tplId);
  if (!tpl) return;
  const newTasks = instancePlanTemplate(tpl, prefix, group, mode);
  for (const t of newTasks) PP.tasks.push(createTask(t));
}

// ── Linked task management (delegates to library) ──

function isLinkedTask(task) {
  return isLinkedPlanTask(task);
}

function isLinkedField(colKey) {
  return colKey === 'name' || colKey === 'o' || colKey === 'm' || colKey === 'p' || colKey === 'depends' || colKey === 'resource';
}

function unlinkTask(task) {
  unlinkPlanTask(task);
}

function propagateTemplateChange(tplId) {
  const tpl = PP.templates.find(t => t.id === tplId);
  if (!tpl) return;
  propagateTemplate(tpl, PP.tasks);
  renderRows();
  scheduleEval();
}

// ── Unlink a specific task from its template ──

function unlinkTaskById(row) {
  const task = PP.tasks[row];
  if (!task || !isLinkedTask(task)) return;
  pushUndo();
  delete task._tpl;
  delete task._tplTask;
  delete task._tplPrefix;
  PP.dirty = true;
  updateTitle();
  renderRows();
  setStatus('msg', 'unlinked ' + task.id);
}

// -- eval.js --

// Evaluation bridge — debounced schedule computation + render update

let _evalTimer = null;

function scheduleEval() {
  clearTimeout(_evalTimer);
  _evalTimer = setTimeout(evaluate, 300);
}

function evaluate() {
  const tasks = buildPlanTasks();
  if (!tasks.length) {
    PP.scheduleResult = null;
    renderRows();
    updateGantt();
    updateStatus();
    return;
  }

  try {
    PP.scheduleResult = schedule(tasks, PP.calendar, PP.projectStart);
    setStatus('msg', 'ready');
  } catch (e) {
    PP.scheduleResult = null;
    setStatus('msg', 'schedule error: ' + e.message);
  }

  renderRows();
  updateGantt();
  updateStatus();

  // Auto-refresh active sidebar panel
  if (PP.ui.sidebarPanel === 'health' && PP.scheduleResult && !$('#pp-sidebar').classList.contains('hidden')) {
    showHealthPanel();
  }
}

function buildPlanTasks() {
  return buildSchedulerTasks(PP.tasks);
}

function updateStatus() {
  const count = PP.tasks.filter(t => t.id).length;
  const el = $('#pp-status-tasks');
  if (el) el.textContent = count + ' task' + (count !== 1 ? 's' : '');

  const durEl = $('#pp-status-duration');
  if (durEl) {
    if (PP.scheduleResult) {
      const cp = PP.scheduleResult.criticalPath;
      const dur = PP.scheduleResult.projectDuration;
      durEl.textContent = 'CP: ' + (cp ? cp.length : 0) + ' tasks, ' + Math.round(dur) + ' days';
    } else {
      durEl.textContent = '';
    }
  }
}

// -- gantt.js --

// Interactive Gantt chart — frozen labels + scrollable timeline

const GANTT = {
  pxPerDay: 18,
  rowH: 28,
  headerH: 44,
  labelW: parseInt(localStorage.getItem('pp-gantt-labelW')) || 220,
  minPx: 4,
  maxPx: 60,
  bufferDays: 30,
  groupH: 22,
};

// Group color palette — muted tones that work on dark background
const GROUP_COLORS = [
  '#4A90D9', '#2D8B6F', '#B87333', '#8E6BBF',
  '#6BBF6B', '#D9A534', '#D94070', '#1ABC9C',
  '#E67E22', '#7B68EE',
];

function buildGroupColorMap(rows) {
  const map = {};
  let ci = 0;
  for (const r of rows) {
    if (r.type !== 'task' || !r.group) continue;
    const top = r.group.split('/')[0].trim();
    if (top && !(top in map)) {
      map[top] = GROUP_COLORS[ci % GROUP_COLORS.length];
      ci++;
    }
  }
  return map;
}

// ── Build display rows from schedule result ──

function ganttRows(result) {
  const scheduled = result.scheduled;
  const collapsed = PP.ui.collapsedGroups;

  // Group tasks by their group field, preserving first-seen order
  const groupOrder = [];
  const groupMap = {};
  for (const s of scheduled) {
    const g = s.group || '';
    if (!(g in groupMap)) {
      groupMap[g] = [];
      groupOrder.push(g);
    }
    groupMap[g].push(s);
  }

  // Sort groups so that shared prefixes are adjacent
  // (e.g. "Deposit A/Exploration" before "Deposit A/Estimation")
  groupOrder.sort();

  // Build rows with hierarchical group headers
  const rows = [];
  let activePath = [];

  for (const g of groupOrder) {
    const newPath = g ? g.split('/').map(p => p.trim()) : [];

    // Emit group headers for new path segments
    if (g !== activePath.join('/')) {
      let common = 0;
      while (common < activePath.length && common < newPath.length && activePath[common] === newPath[common]) {
        common++;
      }

      for (let d = common; d < newPath.length; d++) {
        const fullPath = newPath.slice(0, d + 1).join('/');
        const parentPath = d > 0 ? newPath.slice(0, d).join('/') : null;
        if (parentPath && isGroupHidden(parentPath, collapsed)) continue;
        rows.push({
          type: 'group',
          label: newPath[d],
          path: fullPath,
          depth: d,
          collapsed: collapsed.has(fullPath),
        });
      }
      activePath = newPath;
    }

    // Skip tasks if any ancestor group is collapsed
    if (g && isGroupHidden(g, collapsed)) continue;

    for (const s of groupMap[g]) {
      const srcTask = PP.tasks.find(t => t.id === s.id);
      rows.push({
        type: 'task',
        id: s.id,
        label: s.name || s.id,
        start: s.earlyStart,
        end: s.earlyFinish,
        lateEnd: s.lateFinish,
        isCritical: s.isCritical,
        totalFloat: s.totalFloat || 0,
        progress: s.progress || 0,
        resource: s.resource,
        depends: s.depends || [],
        milestone: s.milestone,
        group: s.group,
        linked: srcTask ? isLinkedTask(srcTask) : false,
      });
    }
  }
  return rows;
}

// Check if a group path (or any of its ancestors) is collapsed
function collapseAllGroups() {
  if (!PP.scheduleResult) return;
  const rows = ganttRows(PP.scheduleResult);
  for (const r of rows) {
    if (r.type === 'group') PP.ui.collapsedGroups.add(r.path);
  }
  showGanttPanel();
}

function expandAllGroups() {
  PP.ui.collapsedGroups.clear();
  showGanttPanel();
}

function isGroupHidden(groupPath, collapsed) {
  if (!groupPath) return false;
  const parts = groupPath.split('/');
  for (let i = 1; i <= parts.length; i++) {
    if (collapsed.has(parts.slice(0, i).join('/'))) return true;
  }
  return false;
}

// ── Date helpers ──

function daysBetween(a, b) {
  return (b - a) / 86400000;
}

function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}

function startOfDay(d) {
  const r = new Date(d);
  r.setHours(0, 0, 0, 0);
  return r;
}

// ── Render ──

function updateGantt() {
  showGanttPanel();
}

function showGanttPanel() {
  const content = $('#pp-main');
  if (!content) return;

  // Clear only gantt-related elements (preserve floating window)
  const old = content.querySelectorAll('.pp-gantt-container, .pp-gantt-zoom, .pp-gantt-empty');
  for (const el of old) el.remove();

  if (!PP.scheduleResult || !PP.scheduleResult.scheduled.length) {
    const msg = document.createElement('div');
    msg.className = 'pp-gantt-empty';
    msg.style.cssText = 'color:var(--fg-dim);padding:20px;text-align:center';
    msg.textContent = 'No schedule to display. Add tasks with IDs and durations.';
    content.appendChild(msg);
    return;
  }

  const result = PP.scheduleResult;
  const rows = ganttRows(result);
  const groupColors = buildGroupColorMap(rows);

  // Compute timeline bounds
  const projStart = startOfDay(new Date(PP.projectStart));
  let earliest = projStart;
  let latest = projStart;
  for (const r of rows) {
    if (r.type !== 'task') continue;
    const s = startOfDay(new Date(r.start));
    const e = startOfDay(new Date(r.end));
    if (s < earliest) earliest = s;
    if (e > latest) latest = e;
    if (r.lateEnd) {
      const le = startOfDay(new Date(r.lateEnd));
      if (le > latest) latest = le;
    }
  }

  // Extend bounds to include MC P90 dates if available
  if (PP.mcResult && PP.mcResult.taskEnd) {
    for (const id in PP.mcResult.taskEnd) {
      const p90 = PP.mcResult.taskEnd[id].p90;
      if (p90) {
        const d = startOfDay(new Date(p90));
        if (d > latest) latest = d;
      }
    }
  }

  // Content span (for "fit" zoom) and generous buffer (for scrolling)
  const timeStart = addDays(earliest, -7);
  const contentDays = Math.ceil(daysBetween(timeStart, latest)) + 14;
  // Buffer: enough extra days that you can't reach the end
  // At any zoom, guarantee 10 screen-widths of scroll past content
  const screenDays = Math.ceil(window.innerWidth / GANTT.pxPerDay);
  const totalDays = contentDays + Math.max(730, screenDays * 10);

  // Build DOM structure

  const container = document.createElement('div');
  container.className = 'pp-gantt-container';

  // ── Labels pane (frozen left) ──
  const labelPane = document.createElement('div');
  labelPane.className = 'pp-gantt-labels';
  labelPane.style.width = GANTT.labelW + 'px';

  // Label header spacer + resize handle
  const labelHeader = document.createElement('div');
  labelHeader.className = 'pp-gantt-label-header';
  labelHeader.style.height = GANTT.headerH + 'px';

  const labelTitle = document.createElement('span');
  labelTitle.textContent = 'Task';
  labelHeader.appendChild(labelTitle);

  const labelResizeHandle = document.createElement('div');
  labelResizeHandle.className = 'pp-gantt-label-resize';
  labelHeader.appendChild(labelResizeHandle);

  // Drag to resize label column
  let lrDragging = false, lrStartX = 0, lrStartW = 0;
  labelResizeHandle.addEventListener('mousedown', e => {
    e.preventDefault();
    e.stopPropagation();
    lrDragging = true;
    lrStartX = e.clientX;
    lrStartW = GANTT.labelW;
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!lrDragging) return;
    const newW = Math.max(80, lrStartW + e.clientX - lrStartX);
    GANTT.labelW = newW;
    labelPane.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!lrDragging) return;
    lrDragging = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    localStorage.setItem('pp-gantt-labelW', GANTT.labelW);
  });

  // Double-click to auto-fit label width
  labelResizeHandle.addEventListener('dblclick', e => {
    e.preventDefault();
    e.stopPropagation();
    // Measure max text width
    const measurer = document.createElement('span');
    measurer.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:12px;font-family:inherit;padding:0 8px';
    document.body.appendChild(measurer);
    let maxW = 60;
    for (const r of rows) {
      const text = r.type === 'group'
        ? '\u25bc ' + r.label
        : (r.linked ? '\u25cf ' : '') + r.label;
      const indent = r.type === 'group' ? (r.depth || 0) * 12 + 8 : 0;
      measurer.textContent = text;
      const w = measurer.offsetWidth + indent + 16; // padding
      if (w > maxW) maxW = w;
    }
    document.body.removeChild(measurer);
    GANTT.labelW = Math.min(maxW, 500);
    labelPane.style.width = GANTT.labelW + 'px';
    localStorage.setItem('pp-gantt-labelW', GANTT.labelW);
  });

  labelPane.appendChild(labelHeader);

  const labelBody = document.createElement('div');
  labelBody.className = 'pp-gantt-label-body';

  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    const div = document.createElement('div');
    if (r.type === 'group') {
      div.className = 'pp-gantt-group-label';
      if (r.collapsed) div.classList.add('pp-gantt-group-collapsed');
      div.style.height = GANTT.groupH + 'px';
      div.style.lineHeight = GANTT.groupH + 'px';
      const indent = (r.depth || 0) * 12;
      div.style.paddingLeft = (8 + indent) + 'px';
      div.innerHTML = '<span class="pp-gantt-group-arrow">' + (r.collapsed ? '\u25b6' : '\u25bc') + '</span> ' + esc(r.label);
      // Color top-level group headers
      const topGroup = r.path ? r.path.split('/')[0].trim() : '';
      if (topGroup && groupColors[topGroup]) div.style.color = groupColors[topGroup];
      div.style.cursor = 'pointer';
      const groupPath = r.path;
      div.addEventListener('click', () => {
        if (PP.ui.collapsedGroups.has(groupPath)) PP.ui.collapsedGroups.delete(groupPath);
        else PP.ui.collapsedGroups.add(groupPath);
        showGanttPanel();
      });
    } else {
      div.className = 'pp-gantt-task-label';
      if (r.isCritical) div.classList.add('pp-gantt-critical-label');
      if (r.linked) div.classList.add('pp-gantt-linked-label');
      div.style.height = GANTT.rowH + 'px';
      div.style.lineHeight = GANTT.rowH + 'px';
      if (r.linked) {
        div.innerHTML = '<span class="pp-link-indicator">\u25cf</span>' + esc(r.label);
      } else {
        div.textContent = r.label;
      }
      div.title = r.id + (r.resource ? ' [' + r.resource + ']' : '') + (r.linked ? ' (linked)' : '');
      div.dataset.taskId = r.id;
      div.addEventListener('click', () => selectTaskInGrid(r.id));
    }
    labelBody.appendChild(div);
  }
  labelBody.style.top = GANTT.headerH + 'px';
  labelPane.appendChild(labelBody);

  // ── Timeline pane (scrollable) ──
  const timePane = document.createElement('div');
  timePane.className = 'pp-gantt-timeline';

  const timelineWidth = Math.max(totalDays * GANTT.pxPerDay, 400);

  // Time header — spans full width so it never ends abruptly
  const header = buildTimeHeader(timeStart, totalDays, timelineWidth);
  timePane.appendChild(header);

  // Timeline body
  const body = document.createElement('div');
  body.className = 'pp-gantt-body';
  body.style.width = timelineWidth + 'px';

  // Today line
  const today = startOfDay(new Date());
  if (today >= timeStart && today <= addDays(timeStart, totalDays)) {
    const todayX = daysBetween(timeStart, today) * GANTT.pxPerDay;
    const todayLine = document.createElement('div');
    todayLine.className = 'pp-gantt-today';
    todayLine.style.left = todayX + 'px';
    body.appendChild(todayLine);
  }

  // Deadline lines
  if (PP.deadlines && PP.deadlines.length) {
    for (const dl of PP.deadlines) {
      if (!dl.date) continue;
      const dlDate = startOfDay(new Date(dl.date));
      const dlX = daysBetween(timeStart, dlDate) * GANTT.pxPerDay;
      if (dlX < 0) continue;

      const line = document.createElement('div');
      line.className = 'pp-gantt-deadline';
      line.style.left = dlX + 'px';
      body.appendChild(line);

      const label = document.createElement('div');
      label.className = 'pp-gantt-deadline-label';
      label.style.left = (dlX + 3) + 'px';
      label.textContent = dl.label || formatDate(dlDate);
      body.appendChild(label);
    }
  }

  // Non-working day columns (weekends + holidays + blocked)
  const nonWorkOverlay = buildNonWorkingOverlay(timeStart, totalDays);
  if (nonWorkOverlay) body.appendChild(nonWorkOverlay);

  // Task id→row-index map (for dependency arrows)
  const taskRowMap = {};
  let rowY = 0;
  for (let i = 0; i < rows.length; i++) {
    if (rows[i].type === 'group') {
      rowY += GANTT.groupH;
    } else {
      taskRowMap[rows[i].id] = { y: rowY, h: GANTT.rowH, row: rows[i] };
      rowY += GANTT.rowH;
    }
  }

  // Render rows
  let y = 0;
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i];
    if (r.type === 'group') {
      // Group header row (subtle background)
      const groupRow = document.createElement('div');
      groupRow.className = 'pp-gantt-group-row';
      groupRow.style.top = y + 'px';
      groupRow.style.height = GANTT.groupH + 'px';
      groupRow.style.width = timelineWidth + 'px';
      body.appendChild(groupRow);
      y += GANTT.groupH;
      continue;
    }

    // Task row background (alternating subtle stripe)
    const rowBg = document.createElement('div');
    rowBg.className = 'pp-gantt-row' + (i % 2 === 0 ? ' pp-gantt-row-even' : '');
    rowBg.style.top = y + 'px';
    rowBg.style.height = GANTT.rowH + 'px';
    rowBg.style.width = timelineWidth + 'px';
    rowBg.dataset.taskId = r.id;
    rowBg.addEventListener('click', () => selectTaskInGrid(r.id));
    body.appendChild(rowBg);

    // Baseline ghost bar
    if (PP.baseline) {
      const bl = PP.baseline[r.id];
      if (bl && !r.milestone) {
        const blStart = startOfDay(new Date(bl.start));
        const blEnd = startOfDay(new Date(bl.end));
        const blX = daysBetween(timeStart, blStart) * GANTT.pxPerDay;
        const blW = Math.max(daysBetween(blStart, blEnd) * GANTT.pxPerDay, 3);
        const ghost = document.createElement('div');
        ghost.className = 'pp-gantt-baseline';
        ghost.style.left = blX + 'px';
        ghost.style.top = (y + GANTT.rowH - 6) + 'px';
        ghost.style.width = blW + 'px';
        ghost.style.height = '3px';
        ghost.title = 'Baseline: ' + formatDate(blStart) + ' \u2013 ' + formatDate(blEnd);
        body.appendChild(ghost);
      }
    }

    // Bar
    const startDate = startOfDay(new Date(r.start));
    const endDate = startOfDay(new Date(r.end));
    const barX = daysBetween(timeStart, startDate) * GANTT.pxPerDay;
    const barW = Math.max(daysBetween(startDate, endDate) * GANTT.pxPerDay, 3);

    if (r.milestone) {
      // Diamond marker
      const diamond = document.createElement('div');
      diamond.className = 'pp-gantt-milestone';
      diamond.style.left = (barX - 6) + 'px';
      diamond.style.top = (y + GANTT.rowH / 2 - 6) + 'px';
      body.appendChild(diamond);
    } else {
      const bar = document.createElement('div');
      bar.className = 'pp-gantt-bar' + (r.isCritical ? ' pp-gantt-bar-critical' : '') + (r.linked ? ' pp-gantt-bar-linked' : '');
      // Color by top-level group
      const topGroup = r.group ? r.group.split('/')[0].trim() : '';
      if (topGroup && groupColors[topGroup]) {
        bar.style.background = groupColors[topGroup];
      }
      bar.style.left = barX + 'px';
      bar.style.top = (y + 4) + 'px';
      bar.style.width = barW + 'px';
      bar.style.height = (GANTT.rowH - 8) + 'px';
      bar.title = r.label + ' (' + formatDate(startDate) + ' \u2013 ' + formatDate(endDate) + ')';
      bar.dataset.taskId = r.id;
      bar.addEventListener('click', e => { e.stopPropagation(); selectTaskInGrid(r.id); });
      body.appendChild(bar);

      // Progress fill
      if (r.progress > 0) {
        const prog = document.createElement('div');
        prog.className = 'pp-gantt-progress';
        prog.style.width = Math.min(r.progress * 100, 100) + '%';
        bar.appendChild(prog);
      }

      // Float indicator (dashed extension)
      if (PP.ui.showFloat && r.totalFloat > 0 && !r.isCritical) {
        const floatW = r.totalFloat * GANTT.pxPerDay;
        const floatBar = document.createElement('div');
        floatBar.className = 'pp-gantt-float';
        floatBar.style.left = (barX + barW) + 'px';
        floatBar.style.top = (y + GANTT.rowH / 2 - 1) + 'px';
        floatBar.style.width = floatW + 'px';
        body.appendChild(floatBar);
      }

      // MC percentile tails — use taskEnd summary stats (absolute dates)
      // The deterministic bar uses ceil-rounded PERT expected durations, so
      // it can exceed MC P50/P75. We position tails absolutely on the timeline
      // and only render the portion that extends past the deterministic bar end.
      if (PP.mcResult && PP.mcResult.taskEnd && PP.mcResult.taskEnd[r.id]) {
        const te = PP.mcResult.taskEnd[r.id];
        const barEnd = barX + barW;

        // P90 outer tail
        if (te.p90) {
          const p90d = startOfDay(new Date(te.p90));
          const p90X = daysBetween(timeStart, p90d) * GANTT.pxPerDay;
          const tailStart = Math.max(barEnd, daysBetween(timeStart, endDate) * GANTT.pxPerDay);
          const outerW = p90X - tailStart;
          if (outerW > 2) {
            const outer = document.createElement('div');
            outer.className = 'pp-gantt-mc-tail' + (r.isCritical ? ' pp-gantt-mc-tail-critical' : '');
            outer.style.left = tailStart + 'px';
            outer.style.top = (y + 4) + 'px';
            outer.style.width = outerW + 'px';
            outer.style.height = (GANTT.rowH - 8) + 'px';
            outer.title = 'P90: ' + formatDate(p90d);
            body.appendChild(outer);
          }
        }

        // P75 inner tail
        if (te.p75) {
          const p75d = startOfDay(new Date(te.p75));
          const p75X = daysBetween(timeStart, p75d) * GANTT.pxPerDay;
          const tailStart = Math.max(barEnd, daysBetween(timeStart, endDate) * GANTT.pxPerDay);
          const innerW = p75X - tailStart;
          if (innerW > 2) {
            const inner = document.createElement('div');
            inner.className = 'pp-gantt-mc-tail pp-gantt-mc-tail-inner' + (r.isCritical ? ' pp-gantt-mc-tail-critical' : '');
            inner.style.left = tailStart + 'px';
            inner.style.top = (y + 4) + 'px';
            inner.style.width = innerW + 'px';
            inner.style.height = (GANTT.rowH - 8) + 'px';
            inner.title = 'P75: ' + formatDate(p75d);
            body.appendChild(inner);
          }
        }
      }
    }

    y += GANTT.rowH;
  }

  // Dependency arrows (SVG overlay)
  const arrowSvg = buildDependencyArrows(rows, taskRowMap, timeStart);
  if (arrowSvg) body.appendChild(arrowSvg);

  // Set total body height
  body.style.height = y + 'px';

  timePane.appendChild(body);

  // ── Assemble ──
  container.appendChild(labelPane);
  container.appendChild(timePane);

  // Insert before the task window (if present), so gantt is behind it
  const taskWin = $('#pp-task-window');
  if (taskWin) content.insertBefore(container, taskWin);
  else content.appendChild(container);

  // ── Zoom controls ──
  const zoomBar = document.createElement('div');
  zoomBar.className = 'pp-gantt-zoom';
  zoomBar.innerHTML = '<button class="pp-btn-small" id="pp-gantt-zout">\u2212</button>'
    + '<span id="pp-gantt-zlabel">' + GANTT.pxPerDay + 'px/day</span>'
    + '<button class="pp-btn-small" id="pp-gantt-zin">+</button>'
    + '<button class="pp-btn-small" id="pp-gantt-zfit">fit</button>';
  if (taskWin) content.insertBefore(zoomBar, taskWin);
  else content.appendChild(zoomBar);

  // Wire zoom
  $('#pp-gantt-zin').addEventListener('click', () => { ganttZoom(GANTT.pxPerDay + 4); });
  $('#pp-gantt-zout').addEventListener('click', () => { ganttZoom(GANTT.pxPerDay - 4); });
  $('#pp-gantt-zfit').addEventListener('click', () => {
    const avail = timePane.clientWidth - 20;
    const fitPx = Math.max(GANTT.minPx, Math.floor(avail / contentDays));
    ganttZoom(fitPx);
  });

  // Mouse wheel zoom on timeline
  timePane.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -2 : 2;
      ganttZoom(GANTT.pxPerDay + delta);
    }
  }, { passive: false });

  // Sync vertical scroll
  timePane.addEventListener('scroll', () => {
    labelBody.style.transform = 'translateY(' + (-timePane.scrollTop) + 'px)';
  });
}

function ganttZoom(newPx) {
  GANTT.pxPerDay = Math.max(GANTT.minPx, Math.min(GANTT.maxPx, newPx));
  showGanttPanel();
}

// ── Time header (month + day ticks) ──

function buildTimeHeader(timeStart, totalDays, width) {
  const header = document.createElement('div');
  header.className = 'pp-gantt-header';
  header.style.width = width + 'px';
  header.style.height = GANTT.headerH + 'px';

  // Month row
  const monthRow = document.createElement('div');
  monthRow.className = 'pp-gantt-month-row';

  // Day row
  const dayRow = document.createElement('div');
  dayRow.className = 'pp-gantt-day-row';

  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let lastMonth = -1;
  let monthStartX = 0;

  // Determine tick interval based on zoom
  let tickInterval = 1;
  if (GANTT.pxPerDay < 8) tickInterval = 7;
  else if (GANTT.pxPerDay < 14) tickInterval = 7;
  else if (GANTT.pxPerDay < 20) tickInterval = 2;

  for (let d = 0; d < totalDays; d++) {
    const date = addDays(timeStart, d);
    const month = date.getMonth();
    const year = date.getFullYear();

    // Month labels
    if (month !== lastMonth) {
      if (lastMonth !== -1) {
        // Close previous month
        const label = document.createElement('div');
        label.className = 'pp-gantt-month';
        label.style.left = monthStartX + 'px';
        label.style.width = (d * GANTT.pxPerDay - monthStartX) + 'px';
        label.textContent = MONTHS[lastMonth] + ' ' + addDays(timeStart, d - 1).getFullYear();
        monthRow.appendChild(label);
      }
      monthStartX = d * GANTT.pxPerDay;
      lastMonth = month;
    }

    // Day ticks — snap to Mondays when showing weekly ticks
    const showTick = tickInterval >= 7
      ? date.getDay() === 1   // Monday
      : d % tickInterval === 0;
    if (showTick) {
      const tick = document.createElement('div');
      tick.className = 'pp-gantt-day-tick';
      tick.style.left = (d * GANTT.pxPerDay) + 'px';
      tick.style.width = (tickInterval * GANTT.pxPerDay) + 'px';
      tick.textContent = date.getDate();
      dayRow.appendChild(tick);
    }
  }

  // Final month label
  if (lastMonth !== -1) {
    const label = document.createElement('div');
    label.className = 'pp-gantt-month';
    label.style.left = monthStartX + 'px';
    label.style.width = (totalDays * GANTT.pxPerDay - monthStartX) + 'px';
    label.textContent = MONTHS[lastMonth] + ' ' + addDays(timeStart, totalDays - 1).getFullYear();
    monthRow.appendChild(label);
  }

  header.appendChild(monthRow);
  header.appendChild(dayRow);
  return header;
}

// ── Non-working day overlay (weekends + holidays + blocked) ──

function buildNonWorkingOverlay(timeStart, totalDays) {
  const cal = PP.calendar;
  const weekends = new Set(cal.weekends || [0, 6]);

  // Build holiday date set
  const holidayMap = {};
  if (cal.holidays) {
    for (const h of cal.holidays) {
      holidayMap[h.date] = h.label || 'Holiday';
    }
  }

  // Build blocked date set
  const blockedMap = {};
  if (cal.blocked) {
    for (const b of cal.blocked) {
      if (!b.start || !b.end) continue;
      const bs = startOfDay(new Date(b.start));
      const be = startOfDay(new Date(b.end));
      for (let d = new Date(bs); d <= be; d.setDate(d.getDate() + 1)) {
        blockedMap[d.toISOString().slice(0, 10)] = b.label || 'Blocked';
      }
    }
  }

  const frag = document.createDocumentFragment();
  let hasAny = false;

  for (let d = 0; d < totalDays; d++) {
    const date = addDays(timeStart, d);
    const dateStr = date.toISOString().slice(0, 10);
    const dow = date.getDay();
    const isWeekend = weekends.has(dow);
    const holiday = holidayMap[dateStr];
    const blocked = blockedMap[dateStr];

    if (isWeekend || holiday || blocked) {
      hasAny = true;
      const col = document.createElement('div');
      col.style.left = (d * GANTT.pxPerDay) + 'px';
      col.style.width = GANTT.pxPerDay + 'px';

      if (holiday) {
        col.className = 'pp-gantt-holiday';
        col.title = holiday;
      } else if (blocked) {
        col.className = 'pp-gantt-blocked';
        col.title = blocked;
      } else {
        col.className = 'pp-gantt-weekend';
      }

      frag.appendChild(col);
    }
  }

  if (!hasAny) return null;
  const wrap = document.createElement('div');
  wrap.className = 'pp-gantt-weekends';
  wrap.appendChild(frag);
  return wrap;
}

// ── Dependency arrows (SVG) ──

function buildDependencyArrows(rows, taskRowMap, timeStart) {
  const taskRows = rows.filter(r => r.type === 'task');
  let hasAny = false;

  let paths = '';
  for (const r of taskRows) {
    if (!r.depends || !r.depends.length) continue;
    const to = taskRowMap[r.id];
    if (!to) continue;

    const toStart = startOfDay(new Date(r.start));
    const toX = daysBetween(timeStart, toStart) * GANTT.pxPerDay;
    const toY = to.y + GANTT.rowH / 2;

    for (const dep0 of r.depends) {
      const depId = typeof dep0 === 'string' ? dep0 : dep0.id;   // { id, lag } entries
      const from = taskRowMap[depId];
      if (!from) continue;
      hasAny = true;

      const fromEnd = startOfDay(new Date(from.row.end));
      const fromX = daysBetween(timeStart, fromEnd) * GANTT.pxPerDay;
      const fromY = from.y + GANTT.rowH / 2;

      // L-elbow connector (matches plan library style)
      const stub = 6;
      let d;
      if (toX - fromX > stub * 2) {
        // Gap available — L-elbow with vertical in the gap
        const mx = fromX + stub;
        d = 'M' + fromX + ' ' + fromY + ' L' + mx + ' ' + fromY + ' L' + mx + ' ' + toY + ' L' + toX + ' ' + toY;
      } else {
        // Tight — vertical drop from finish, short horizontal to start
        d = 'M' + fromX + ' ' + fromY + ' L' + fromX + ' ' + toY + ' L' + toX + ' ' + toY;
      }
      paths += '<path d="' + d + '" fill="none" stroke="#555" stroke-width="1" opacity="0.5"/>';
      // Arrowhead
      paths += '<path d="M' + (toX - 5) + ' ' + (toY - 3) + ' L' + toX + ' ' + toY + ' L' + (toX - 5) + ' ' + (toY + 3) + '" fill="none" stroke="#555" stroke-width="1" opacity="0.5"/>';
    }
  }

  if (!hasAny) return null;

  const totalH = rows.reduce((h, r) => h + (r.type === 'group' ? GANTT.groupH : GANTT.rowH), 0);
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'pp-gantt-arrows');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', totalH);
  svg.style.position = 'absolute';
  svg.style.top = '0';
  svg.style.left = '0';
  svg.style.pointerEvents = 'none';
  svg.innerHTML = paths;
  return svg;
}

// ── Interaction ──

function selectTaskInGrid(taskId) {
  const idx = PP.tasks.findIndex(t => t.id === taskId);
  if (idx >= 0) {
    selectRow(idx);
    scrollGridToRow(idx);
  }
}

function scrollGanttToTask(taskId) {
  if (!PP.scheduleResult) return;
  const s = PP.scheduleResult.scheduled.find(t => t.id === taskId);
  if (!s || !s.earlyStart) return;

  const timePane = $('.pp-gantt-timeline');
  if (!timePane) return;

  // Compute the x position of this task's bar
  // We need to recalculate timeStart the same way showGanttPanel does
  const projStart = startOfDay(new Date(PP.projectStart));
  let earliest = projStart;
  for (const r of PP.scheduleResult.scheduled) {
    const rs = startOfDay(new Date(r.earlyStart));
    if (rs < earliest) earliest = rs;
  }
  const timeStart = addDays(earliest, -7);
  const taskStart = startOfDay(new Date(s.earlyStart));
  const taskX = daysBetween(timeStart, taskStart) * GANTT.pxPerDay;

  // Scroll so the task bar is roughly centered
  const targetScroll = taskX - timePane.clientWidth / 3;
  timePane.scrollLeft = Math.max(0, targetScroll);
}

      + '</tr>';
  }
  blockedHtml += '</tbody></table>';
  blockedHtml += '<button class="pp-btn-small" id="pp-add-blocked">+ add blocked period</button>';

  content.innerHTML = '<div class="pp-calendar-panel">'
    + '<label>Project Start</label>'
    + '<input type="date" id="pp-project-start" value="' + PP.projectStart + '">'
    + '<label>Holiday Preset</label>'
    + '<select id="pp-cal-preset">' + presetOpts + '</select>'

    + '</div>';

    PP.projectStart = e.target.value;
    PP.dirty = true;
    updateTitle();
    scheduleEval();
  });

  $('#pp-cal-preset').addEventListener('change', e => {
    const val = e.target.value;
    applyCalendarPreset(val);
    showCalendarPanel(); // re-render
  });

  // Blocked period inputs
  for (const input of $$('.pp-blocked-table input')) {
    input.addEventListener('change', e => {
      const row = e.target.closest('tr');
      const bi = parseInt(row.dataset.bi);
      const field = e.target.dataset.field;
      PP.calendar.blocked[bi][field] = e.target.value;
      PP.dirty = true;
      updateTitle();
      scheduleEval();
    });
  }

  for (const btn of $$('.pp-blocked-rm')) {
    btn.addEventListener('click', e => {
      const i = parseInt(e.target.dataset.rm);
      PP.calendar.blocked.splice(i, 1);
      PP.dirty = true;
      updateTitle();
      showCalendarPanel();
      scheduleEval();
    });
  }

  $('#pp-add-blocked').addEventListener('click', () => {
    PP.calendar.blocked.push({ start: '', end: '', label: '' });
    PP.dirty = true;
    showCalendarPanel();
  });
}

function applyCalendarPreset(preset) {
  PP.calendarPreset = preset || null;
  PP.dirty = true;
  updateTitle();

  if (!preset) {
    PP.calendar.holidays = [];
    scheduleEval();
    return;
  }

  const startYear = parseInt(PP.projectStart.slice(0, 4)) || new Date().getFullYear();
  const endYear = startYear + 2;

  try {
    PP.calendar.holidays = resolveCalendarPreset(preset, startYear, endYear);
  } catch (e) {
    setStatus('msg', 'calendar error: ' + e.message);
    PP.calendar.holidays = [];
  }

  scheduleEval();
}

// Analysis panels — Monte Carlo, sensitivity, EVM, health, compress

function showMCPanel() {

    + '<h3>Monte Carlo Simulation</h3>'
    + '<div class="pp-analysis-controls">'

    + '<button class="pp-run-btn" id="pp-mc-run">Run</button>'
    + '</div>';

  // Deadline inputs
  html += '<div class="pp-calendar-section">Deadlines</div>';
  const deadlines = PP.deadlines || [];
  for (let i = 0; i < deadlines.length; i++) {
    const d = deadlines[i];
    const taskOpts = PP.tasks.filter(t => t.id).map(t =>
      '<option value="' + esc(t.id) + '"' + (d.taskId === t.id ? ' selected' : '') + '>' + esc(t.id) + '</option>'
    ).join('');
    html += '<div class="pp-deadline-row" data-di="' + i + '">'
      + '<input type="text" placeholder="Label" value="' + esc(d.label || '') + '" data-field="label" style="width:80px">'
      + '<select data-field="taskId"><option value="">Project</option>' + taskOpts + '</select>'
      + '<input type="date" value="' + esc(d.date || '') + '" data-field="date">'
      + '<button class="pp-blocked-rm" data-drm="' + i + '">\u00d7</button>'
      + '</div>';
  }
  html += '<button class="pp-btn-small" id="pp-add-deadline">+ add deadline</button>';

  // Results area
  html += '<div id="pp-mc-results"></div></div>';
  content.innerHTML = html;

  // Wire events
  $('#pp-mc-run').addEventListener('click', runMonteCarlo);
  $('#pp-add-deadline').addEventListener('click', () => {
    PP.deadlines.push({ label: '', taskId: '', date: '' });
    PP.dirty = true;
    showMCPanel();
  });

  for (const input of $$('.pp-deadline-row input, .pp-deadline-row select')) {
    input.addEventListener('change', e => {
      const row = e.target.closest('.pp-deadline-row');
      const di = parseInt(row.dataset.di);
      const field = e.target.dataset.field;
      PP.deadlines[di][field] = e.target.value;
      PP.dirty = true;
      updateTitle();
    });
  }

  for (const btn of $$('[data-drm]')) {
    btn.addEventListener('click', e => {
      PP.deadlines.splice(parseInt(e.target.dataset.drm), 1);
      PP.dirty = true;
      showMCPanel();
    });
  }

  // Show previous results if available
  if (PP.mcResult) renderMCResults();
}

function runMonteCarlo() {
  const tasks = buildPlanTasks();
  if (!tasks.length) {
    setStatus('msg', 'no tasks to simulate');
    return;
  }

  const iterInput = $('#pp-mc-iter');
  const iterations = parseInt(iterInput?.value) || 5000;

  _runMC(iterations);
}

// Top-level MC run — works without the sidebar panel open
function runMC(iterations) {
  const tasks = buildPlanTasks();
  if (!tasks.length) {
    setStatus('msg', 'no tasks to simulate');
    return;
  }
  _runMC(iterations || PP.mcIterations || 5000);
}

function _runMC(iterations) {
  const tasks = buildPlanTasks();
  setStatus('msg', 'running Monte Carlo...');
  PP.mcIterations = iterations;

  // Use setTimeout to let the UI update
  setTimeout(() => {
    try {
      PP.mcResult = monteCarlo(tasks, PP.calendar, PP.projectStart, {
        iterations,
        sensitivity: true,
        retainTaskEnds: true,
      });
      // Refresh sidebar results if open
      renderMCResults();
      // Refresh gantt to show percentile bands
      updateGantt();
      // Persist to IndexedDB
      if (PP.projectId) mcSave(PP.projectId, PP.mcResult);
      setStatus('msg', 'Monte Carlo complete (' + iterations + ' iterations)');
    } catch (e) {
      setStatus('msg', 'MC error: ' + e.message);
    }
  }, 10);
}

function renderMCResults() {
  const results = $('#pp-mc-results');
  if (!results || !PP.mcResult) return;

  const mc = PP.mcResult;
  let html = '<div class="pp-calendar-section">Project End Distribution</div>';

  // Percentile table
  html += '<table class="pp-percentile-table"><thead><tr><th>Percentile</th><th>Date</th></tr></thead><tbody>';
  const pe = mc.projectEnd;
  for (const [label, key] of [['P10', 'p10'], ['P50 (median)', 'p50'], ['P75', 'p75'], ['P90', 'p90'], ['Mean', 'mean']]) {
    const val = pe[key];
    const dateStr = val instanceof Date ? formatDate(val) : (typeof val === 'string' ? val.slice(0, 10) : String(val));
    html += '<tr><td>' + label + '</td><td>' + dateStr + '</td></tr>';
  }
  html += '</tbody></table>';

  // MC histogram plot
  try {
    const svg = monteCarloPlot(mc, { width: 400, height: 200, showPercentiles: true });
    html += '<div class="pp-svg-wrap" style="margin-top:12px">' + svg + '</div>';
  } catch (_) { /* ignore render errors */ }

  // Deadline risk
  const activeDeadlines = PP.deadlines.filter(d => d.date);
  if (activeDeadlines.length && mc.taskEndDates) {
    try {
      const deadlineObjs = activeDeadlines.map(d => ({
        label: d.label || d.taskId || 'Project',
        taskId: d.taskId || null,
        deadline: d.date,
      }));
      const svg = deadlineRiskPlot(mc, deadlineObjs, { width: 400, height: 200 });
      html += '<div class="pp-calendar-section">Deadline Risk</div>';
      html += '<div class="pp-svg-wrap">' + svg + '</div>';
    } catch (_) { /* ignore */ }
  }

  results.innerHTML = html;
}

function showSensitivityPanel() {
  const content = $('#pp-sidebar-content');

function showCompressPanel() {
  const content = $('#pp-sidebar-content');
  if (!content) return;

  const tasks = buildPlanTasks();
  const pertTasks = tasks.filter(t => t.pert);

  if (!pertTasks.length) {
    content.innerHTML = '<div class="pp-analysis"><h3>Compress</h3><p style="color:var(--fg-dim)">Need tasks with PERT estimates (O/M/P).</p></div>';
    return;
  }

  let html = '<div class="pp-analysis"><h3>Schedule Compression</h3>'
    + '<div class="pp-analysis-controls">'
    + '<label>Budget (days)</label>'
    + '<input type="number" id="pp-compress-budget" value="" placeholder="auto">'
    + '<button class="pp-run-btn" id="pp-compress-run">Analyze</button>'
    + '</div>'
    + '<div id="pp-compress-results"></div></div>';

  content.innerHTML = html;

  $('#pp-compress-run').addEventListener('click', () => {
    const budgetInput = $('#pp-compress-budget');
    const budget = parseFloat(budgetInput?.value);

    try {
      const result = compress(pertTasks, isNaN(budget) ? undefined : budget);
      let rhtml = '<table class="pp-percentile-table"><thead><tr><th>Task</th><th>Original</th><th>Compressed</th><th>Surplus</th></tr></thead><tbody>';

      if (result.tasks) {
        for (const t of result.tasks) {
          rhtml += '<tr><td>' + esc(t.id || t.name || '?') + '</td>'
            + '<td class="pp-number">' + fmtNum(t.original, 1) + '</td>'
            + '<td class="pp-number">' + fmtNum(t.compressed, 1) + '</td>'
            + '<td class="pp-number">' + fmtNum(t.surplus, 1) + '</td></tr>';
        }
      }

      rhtml += '</tbody></table>';

      if (result.alpha != null) {
        rhtml += '<div style="margin-top:8px;color:var(--fg-dim)">Alpha: ' + fmtNum(result.alpha, 3)
          + ' | Feasible: ' + (result.feasible ? 'yes' : 'no') + '</div>';
      }

      $('#pp-compress-results').innerHTML = rhtml;
      setStatus('msg', 'compression analysis complete');
    } catch (e) {
      $('#pp-compress-results').innerHTML = '<p style="color:var(--err)">' + esc(e.message) + '</p>';
    }
  });
}

// Helpers

function healthIcon(color) {
  switch (color) {
    case 'green': return '\u25cf';
    case 'amber': return '\u25cf';
    case 'red': return '\u25cf';
    default: return '\u25cb';
  }
}

function fmtNum(n, decimals) {
  if (n == null || isNaN(n)) return '\u2014';
  return Number(n).toFixed(decimals != null ? decimals : 0);
}

    label.className = 'pp-menu-label';
    label.textContent = menu.label;
    item.appendChild(label);

    const dropdown = document.createElement('div');
    dropdown.className = 'pp-dropdown';

    for (const entry of menu.items) {
      if (entry.type === 'sep') {
        const sep = document.createElement('div');
        sep.className = 'pp-menu-sep';
        dropdown.appendChild(sep);
        continue;
      }
      const btn = document.createElement('button');
      btn.className = 'pp-menu-entry';
      const lbl = document.createElement('span');
      lbl.textContent = entry.label;
      btn.appendChild(lbl);
      if (entry.shortcut) {
        const sc = document.createElement('span');
        sc.className = 'pp-menu-shortcut';
        sc.textContent = entry.shortcut;
        btn.appendChild(sc);
      }
      btn.addEventListener('click', () => {
        closeMenus();
        entry.action();
      });
      dropdown.appendChild(btn);
    }

    item.appendChild(dropdown);
    bar.appendChild(item);

    label.addEventListener('click', e => {
      e.stopPropagation();
      if (item.classList.contains('open')) {
        closeMenus();
      } else {
        closeMenus();
        if (menu.onOpen) menu.onOpen(dropdown);
        item.classList.add('open');
        PP.menuOpen = item;
      }
    });

    label.addEventListener('mouseenter', () => {
      if (PP.menuOpen && PP.menuOpen !== item) {
        closeMenus();
        if (menu.onOpen) menu.onOpen(dropdown);
        item.classList.add('open');
        PP.menuOpen = item;
      }
    });
  }

  document.addEventListener('click', e => {
    if (PP.menuOpen && !e.target.closest('.pp-menu-item')) {
      closeMenus();
    }
  });
}
