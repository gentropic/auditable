// -- file.js --

// File operations — new/open/save .plan JSON

async function newFile() {
  if (PP.dirty && !confirm('Discard unsaved changes?')) return;
  PP.tasks = [createTask()];
  PP.templates = [];
  PP.calendar = { weekends: [0, 6], holidays: [], blocked: [] };
  PP.calendarPreset = null;
  PP.projectStart = new Date().toISOString().slice(0, 10);
  PP.deadlines = [];
  PP.scheduleResult = null;
  PP.mcResult = null;
  PP.evmResult = null;
  PP.fileHandle = null;
  PP.fileName = null;
  PP.dirty = false;
  PP.undoStack = [];
  PP.redoStack = [];
  projectCreate();
  startProject();
}

async function openFile() {
  try {
    let file, handle;
    if (window.showOpenFilePicker) {
      [handle] = await window.showOpenFilePicker({
        types: [
          { description: 'Plan files', accept: { 'application/json': ['.plan', '.json'] } },
        ],
      });
      file = await handle.getFile();
    } else {
      file = await pickFile('.plan,.json');
      if (!file) return;
      handle = null;
    }

    const text = await file.text();
    const data = JSON.parse(text);
    loadProjectData(data);
    PP.fileHandle = handle;
    PP.fileName = file.name;
    PP.dirty = false;
    const pname = (PP.fileName || 'untitled').replace(/\.\w+$/, '');
    projectCreate(pname);
    startProject();
    setStatus('msg', 'opened ' + file.name);
  } catch (e) {
    if (e.name !== 'AbortError') setStatus('msg', 'open failed: ' + e.message);
  }
}

async function saveFile() {
  if (PP.fileHandle) {
    try {
      const writable = await PP.fileHandle.createWritable();
      await writable.write(serializeProject());
      await writable.close();
      PP.dirty = false;
      projectSave();
      updateTitle();
      setStatus('msg', 'saved');
      return;
    } catch (e) {
      // Fall through
    }
  }
  // No file handle — localStorage
  if (isProjectUntitled()) {
    showRenamePrompt('untitled', name => {
      projectUpdateName(name);
      PP.fileName = name;
      PP.dirty = false;
      projectSave();
      updateTitle();
      setStatus('msg', 'saved as ' + name);
    });
    return;
  }
  PP.dirty = false;
  projectSave();
  updateTitle();
  setStatus('msg', 'saved');
}

async function saveFileAs() {
  try {
    if (window.showSaveFilePicker) {
      const handle = await window.showSaveFilePicker({
        suggestedName: PP.fileName || 'untitled.plan',
        types: [{ description: 'Plan files', accept: { 'application/json': ['.plan'] } }],
      });
      const writable = await handle.createWritable();
      await writable.write(serializeProject());
      await writable.close();
      PP.fileHandle = handle;
      PP.fileName = handle.name;
      PP.dirty = false;
      projectUpdateName(handle.name.replace(/\.\w+$/, ''));
      projectSave();
      updateTitle();
      setStatus('msg', 'saved');
    } else {
      downloadBlob(serializeProject(), PP.fileName || 'untitled.plan', 'application/json');
      PP.dirty = false;
      updateTitle();
      setStatus('msg', 'downloaded');
    }
  } catch (e) {
    if (e.name !== 'AbortError') setStatus('msg', 'save failed: ' + e.message);
  }
}

function serializeProject() {
  const projects = getProjects();
  const p = projects.find(e => e.id === PP.projectId);
  return serializePlan({
    title: (p && p.name) || PP.fileName || 'untitled',
    projectStart: PP.projectStart,
    calendar: PP.calendar,
    calendarPreset: PP.calendarPreset,
    deadlines: PP.deadlines,
    baseline: PP.baseline,
    templates: PP.templates,
    tasks: PP.tasks,
    settings: {
      showFloat: PP.ui.showFloat,
      showProgress: PP.ui.showProgress,
      pxPerDay: GANTT.pxPerDay,
      mcIterations: PP.mcIterations || 5000,
    },
  });
}

function loadProjectData(data) {
  const project = parsePlan(data);

  PP.tasks = project.tasks.map(t => createTask(t));
  PP.templates = project.templates.map(t => ({
    ...createTemplate(t),
    tasks: (t.tasks || []).map(tt => createTemplateTask(tt)),
  }));
  PP.projectStart = project.projectStart;
  PP.deadlines = project.deadlines;
  PP.undoStack = [];
  PP.redoStack = [];
  PP.mcResult = null;
  PP.evmResult = null;
  PP.baseline = project.baseline;
  PP.calendarPreset = project.calendarPreset;
  PP.calendar = project.calendar;

  const s = project.settings;
  if (s.showFloat != null) PP.ui.showFloat = s.showFloat;
  if (s.showProgress != null) PP.ui.showProgress = s.showProgress;
  if (s.pxPerDay != null) GANTT.pxPerDay = Math.max(GANTT.minPx, Math.min(GANTT.maxPx, s.pxPerDay));
  if (s.mcIterations != null) PP.mcIterations = s.mcIterations;
}

// Helpers

function downloadBlob(data, filename, type) {
  const blob = typeof data === 'string' ? new Blob([data], { type }) :
    data instanceof Blob ? data :
    new Blob([data], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = accept;
    input.onchange = () => resolve(input.files[0] || null);
    input.click();
  });
}

function updateTitle() {
  const name = PP.fileName || 'untitled';
  document.title = (PP.dirty ? '\u2022 ' : '') + name + ' \u2014 Plan';
}

function startProject() {
  createTaskWindow();
  showTaskWindow();
  buildGrid();
  evaluate();
  updateTitle();
  // Restore cached MC results
  if (PP.projectId) {
    mcLoad(PP.projectId).then(data => {
      if (data) {
        PP.mcResult = data;
        updateGantt();
      }
    });
  }
}

// ── Baseline ──

function saveBaseline() {
  if (!PP.scheduleResult || !PP.scheduleResult.scheduled.length) {
    setStatus('msg', 'no schedule to baseline');
    return;
  }
  const bl = {};
  for (const s of PP.scheduleResult.scheduled) {
    bl[s.id] = {
      start: s.earlyStart instanceof Date ? s.earlyStart.toISOString() : s.earlyStart,
      end: s.earlyFinish instanceof Date ? s.earlyFinish.toISOString() : s.earlyFinish,
    };
  }
  PP.baseline = bl;
  PP.dirty = true;
  updateTitle();
  updateGantt();
  setStatus('msg', 'baseline saved');
}

function clearBaseline() {
  PP.baseline = null;
  PP.dirty = true;
  updateTitle();
  updateGantt();
  setStatus('msg', 'baseline cleared');
}

// ── IndexedDB for MC results ──

function _mcDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('pp-mc', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('mc'); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function mcSave(projectId, data) {
  return _mcDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('mc', 'readwrite');
    tx.objectStore('mc').put(data, projectId);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  })).catch(() => {});
}

function mcLoad(projectId) {
  return _mcDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('mc', 'readonly');
    const req = tx.objectStore('mc').get(projectId);
    req.onsuccess = () => { db.close(); resolve(req.result || null); };
    req.onerror = () => { db.close(); reject(req.error); };
  })).catch(() => null);
}

function mcDelete(projectId) {
  return _mcDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('mc', 'readwrite');
    tx.objectStore('mc').delete(projectId);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  })).catch(() => {});
}

// The full schedule as CSV — inputs AND computed columns, one row per task.
// Opens straight in Excel/Sheets; re-imports through Import CSV.
function exportScheduleCSV() {
  if (!PP.scheduleResult) { setStatus('msg', 'nothing to export — no schedule'); return; }
  const byId = new Map(PP.scheduleResult.scheduled.map(t => [t.id, t]));
  const rows = [['ID', 'Name', 'Group', 'O', 'M', 'P', 'Depends', 'Resource', 'Progress', 'Start', 'Finish', 'Float', 'Critical']];
  for (const t of PP.tasks) {
    if (!t.id) continue;
    const sch = byId.get(t.id);
    rows.push([t.id, t.name, t.group, t.o, t.m, t.p, t.depends, t.resource, t.progress,
      sch ? _isoDay(sch.earlyStart) : '', sch ? _isoDay(sch.earlyFinish) : '',
      sch ? sch.totalFloat : '', sch && sch.isCritical ? 'yes' : '']);
  }
  const csv = rows.map(r => r.map(_csvEsc).join(',')).join('\n');
  downloadBlob(csv, _planBaseName() + '-schedule.csv', 'text/csv');
  setStatus('msg', 'exported ' + (rows.length - 1) + ' tasks as CSV');
}

// The gantt as standalone SVG — the LIBRARY renderer (print/report-ready),
// not a screenshot of the interactive one.
function exportGanttSVG() {
  if (!PP.scheduleResult) { setStatus('msg', 'nothing to export — no schedule'); return; }
  const svg = gantt(PP.scheduleResult, {
    width: 1200,
    calendar: PP.calendar,
    baseline: PP.baseline || undefined,
    deadlines: PP.deadlines && PP.deadlines.length ? PP.deadlines : undefined,
  });
  downloadBlob(svg, _planBaseName() + '-gantt.svg', 'image/svg+xml');
  setStatus('msg', 'exported gantt SVG');
}

// ── Import CSV / paste from Excel ───────────────────────────────────────────
// Header-mapped, delimiter-sniffed (tab wins if present — Excel paste is TSV).
// Recognized headers (case-insensitive): id, name, group, o/optimistic,
// m/most likely/duration, p/pessimistic, depends/predecessors, resource,
// progress/%. Unknown columns are ignored.

function _parseDelimited(text) {
  const delim = text.includes('\t') ? '\t' : ',';
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  row.push(field);
  if (row.length > 1 || row[0] !== '') rows.push(row);
  return rows;
}

const _IMPORT_HEADERS = {
  id: 'id', name: 'name', task: 'name', group: 'group', phase: 'group',
  o: 'o', optimistic: 'o', m: 'm', 'most likely': 'm', duration: 'm', dur: 'm',
  p: 'p', pessimistic: 'p',
  depends: 'depends', predecessors: 'depends', deps: 'depends', pred: 'depends',
  resource: 'resource', who: 'resource',
  progress: 'progress', '%': 'progress', 'progress %': 'progress',
};

function importTasksFromText(text, { append } = {}) {
  const rows = _parseDelimited(String(text).trim());
  if (rows.length < 2) throw new Error('need a header row + at least one task row');
  const map = rows[0].map(h => _IMPORT_HEADERS[String(h).trim().toLowerCase()] || null);
  if (!map.includes('id') && !map.includes('name')) throw new Error('no id or name column recognized in the header');
  const tasks = [];
  for (const r of rows.slice(1)) {
    const t = createTask();
    for (let i = 0; i < map.length; i++) {
      if (!map[i] || r[i] == null) continue;
      t[map[i]] = String(r[i]).trim();
    }
    if (!t.id && t.name) t.id = t.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    if (t.id || t.name) tasks.push(t);
  }
  if (!tasks.length) throw new Error('no tasks in the pasted data');
  pushUndo();
  PP.tasks = append ? [...PP.tasks.filter(x => x.id || x.name), ...tasks] : tasks;
  PP.dirty = true;
  renderRows();
  scheduleEval();
  return tasks.length;
}

// ── Project CRUD ──

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function getProjects() {
  try { return JSON.parse(localStorage.getItem('pp-projects') || '[]'); }
  catch { return []; }
}

function setProjects(list) {
  localStorage.setItem('pp-projects', JSON.stringify(list));
}

function projectCreate(name) {
  const id = genId();
  const list = getProjects();
  list.unshift({ id, name: name || 'untitled', ts: Date.now() });
  if (list.length > 20) {
    const removed = list.splice(20);
    for (const r of removed) localStorage.removeItem('pp-project:' + r.id);
  }
  setProjects(list);
  localStorage.setItem('pp-project:' + id, serializeProject());
  localStorage.setItem('pp-active', id);
  PP.projectId = id;
  return id;
}

function projectSave() {
  if (!PP.projectId) return;
  localStorage.setItem('pp-project:' + PP.projectId, serializeProject());
  const list = getProjects();
  const entry = list.find(p => p.id === PP.projectId);
  if (entry) {
    entry.ts = Date.now();
    setProjects(list);
  }
}

function projectUpdateName(name) {
  if (!PP.projectId) return;
  const list = getProjects();
  const entry = list.find(p => p.id === PP.projectId);
  if (entry) {
    entry.name = name;
    setProjects(list);
  }
}

function projectLoad(id) {
  const raw = localStorage.getItem('pp-project:' + id);
  if (raw == null) return null;
  localStorage.setItem('pp-active', id);
  PP.projectId = id;
  try { return JSON.parse(raw); }
  catch { return null; }
}

function projectRemove(id) {
  let list = getProjects();
  list = list.filter(p => p.id !== id);
  setProjects(list);
  localStorage.removeItem('pp-project:' + id);
  if (localStorage.getItem('pp-active') === id) {
    localStorage.removeItem('pp-active');
  }
}

function isProjectUntitled() {
  if (!PP.projectId) return true;
  const projects = getProjects();
  const p = projects.find(e => e.id === PP.projectId);
  return !p || p.name === 'untitled';
}

// ── Time formatting ──

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' hr ago';
  const d = Math.floor(h / 24);
  if (d === 1) return 'yesterday';
  if (d < 30) return d + ' days ago';
  return new Date(ts).toLocaleDateString();
}

// ── Splash screen ──

function showSplash(onSelect) {
  const projects = getProjects();
  const activeId = localStorage.getItem('pp-active');

  const overlay = document.createElement('div');
  overlay.id = 'pp-splash';
  overlay.className = 'pp-splash';

  let recentHtml = '';
  if (projects.length) {
    recentHtml = '<div class="pp-splash-section">Recent</div>'
      + '<div class="pp-splash-list">'
      + projects.map(p => '<div class="pp-splash-entry" data-id="' + p.id + '">'
        + '<span class="pp-splash-name">' + esc(p.name) + '</span>'
        + '<span class="pp-splash-time">' + timeAgo(p.ts) + '</span>'
        + '<button class="pp-splash-rm" data-rm="' + p.id + '" title="Remove">\u00d7</button>'
        + '</div>').join('')
      + '</div>';
  }

  const hasActive = activeId && projects.some(p => p.id === activeId);

  const exOpts = Object.keys(EXAMPLES).map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');

  overlay.innerHTML = '<div class="pp-splash-box">'
    + '<div class="pp-splash-title">p l a n</div>'
    + '<div class="pp-splash-actions">'
    + '<button class="pp-splash-btn" data-action="new">New</button>'
    + '<button class="pp-splash-btn" data-action="open">Open\u2026</button>'
    + '<select class="pp-splash-select" data-action="example">'
    + '<option value="" disabled selected>Examples</option>'
    + exOpts
    + '</select>'
    + '</div>'
    + recentHtml
    + (hasActive ? '<div class="pp-splash-resume"><button class="pp-splash-btn" data-action="resume">Resume Last</button></div>' : '')
    + '</div>';

  function dismiss() {
    overlay.remove();
    document.removeEventListener('keydown', onKey);
  }

  function onKey(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (hasActive) {
        dismiss();
        onSelect('resume');
      }
    }
  }

  overlay.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      e.stopPropagation();
      const rid = rm.dataset.rm;
      projectRemove(rid);
      rm.closest('.pp-splash-entry').remove();
      if (!overlay.querySelector('.pp-splash-entry')) {
        const sec = overlay.querySelector('.pp-splash-section');
        const list = overlay.querySelector('.pp-splash-list');
        if (sec) sec.remove();
        if (list) list.remove();
      }
      return;
    }

    const btn = e.target.closest('[data-action]');
    if (btn) {
      const action = btn.dataset.action;
      if (action === 'new' || action === 'resume' || action === 'open') {
        dismiss();
        onSelect(action);
      }
      return;
    }

    const entry = e.target.closest('.pp-splash-entry');
    if (entry) {
      dismiss();
      onSelect('load', entry.dataset.id);
    }
  });

  const sel = overlay.querySelector('.pp-splash-select');
  if (sel) {
    sel.addEventListener('change', () => {
      const name = sel.value;
      if (name && EXAMPLES[name]) {
        dismiss();
        onSelect('example', name);
      }
    });
  }

  document.addEventListener('keydown', onKey);
  document.body.appendChild(overlay);
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Inline rename prompt ──

function showRenamePrompt(current, onDone) {
  const overlay = document.createElement('div');
  overlay.className = 'pp-modal-overlay';
  overlay.innerHTML = '<div class="pp-modal">'
    + '<div class="pp-modal-title">Project Name</div>'
    + '<input class="pp-rename-input" type="text" value="' + esc(current) + '" spellcheck="false">'
    + '<div class="pp-rename-actions">'
    + '<button class="pp-modal-close" data-action="cancel">Cancel</button>'
    + '<button class="pp-modal-close" data-action="ok">OK</button>'
    + '</div></div>';

  const input = overlay.querySelector('input');
  const finish = (accept) => {
    overlay.remove();
    if (accept) {
      const name = input.value.trim() || 'untitled';
      onDone(name);
    }
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });

  overlay.addEventListener('click', e => {
    const action = e.target.dataset.action;
    if (action === 'ok') finish(true);
    else if (action === 'cancel') finish(false);
    else if (e.target === overlay) finish(false);
  });

  document.body.appendChild(overlay);
  requestAnimationFrame(() => { input.select(); input.focus(); });
}

function renameProject() {
  const projects = getProjects();
  const p = projects.find(e => e.id === PP.projectId);
  const current = (p && p.name) || PP.fileName || 'untitled';
  showRenamePrompt(current, name => {
    projectUpdateName(name);
    PP.fileName = name;
    updateTitle();
    setStatus('msg', 'renamed to ' + name);
  });
}

// -- init.js --

// Bootstrap — init IIFE, event wiring, sidebar management

function setStatus(key, text) {
  if (key === 'msg') {
    const el = $('#pp-status-msg');
    if (el) el.textContent = text;
  }
}

// ── Sidebar ──

const SIDEBAR_PANELS = {
  calendar:    { label: 'Calendar',    show: showCalendarPanel },
  mc:          { label: 'Monte Carlo', show: showMCPanel },
  sensitivity: { label: 'Sensitivity', show: showSensitivityPanel },
  burndown:    { label: 'Burndown',    show: showBurndownPanel },
  evm:         { label: 'Earned Value', show: showEVMPanel },
  health:      { label: 'Health',      show: showHealthPanel },
  compress:    { label: 'Compress',    show: showCompressPanel },
};

function showSidebar(key) {
  const sidebar = $('#pp-sidebar');
  const titleEl = $('#pp-sidebar-title');
  if (!sidebar) return;

  const panel = SIDEBAR_PANELS[key];
  if (!panel) return;

  PP.ui.sidebarPanel = key;
  titleEl.textContent = panel.label;
  sidebar.classList.remove('hidden');
  panel.show();
}

function hideSidebar() {
  const sidebar = $('#pp-sidebar');
  if (sidebar) sidebar.classList.add('hidden');
  PP.ui.sidebarPanel = null;
}

function toggleSidebar(key) {
  const sidebar = $('#pp-sidebar');
  if (!sidebar) return;
  if (!sidebar.classList.contains('hidden') && PP.ui.sidebarPanel === key) {
    hideSidebar();
  } else {
    showSidebar(key);
  }
}

;(function init() {
  // Global keyboard shortcuts
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveFile();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'o') {
      e.preventDefault();
      openFile();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
      e.preventDefault();
      newFile();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'e') {
      e.preventDefault();
      toggleTaskWindow();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 't') {
      e.preventDefault();
      toggleTemplateWindow();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'm') {
      e.preventDefault();
      runMC();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
      // Only intercept if not focused on a contenteditable cell
      if (!document.activeElement || !document.activeElement.contentEditable || document.activeElement.contentEditable !== 'true') {
        e.preventDefault();
        undo();
      }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
      if (!document.activeElement || !document.activeElement.contentEditable || document.activeElement.contentEditable !== 'true') {
        e.preventDefault();
        redo();
      }
    }
    if (e.key === 'F1') {
      e.preventDefault();
      const overlay = $('#pp-modal-overlay');
      if (overlay) overlay.remove();
      else showShortcuts();
    }
  });

  // Dirty check on unload
  window.addEventListener('beforeunload', e => {
    if (PP.dirty) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // Build menu bar
  initMenuBar();

  // Wire sidebar close button
  const sidebarClose = $('#pp-sidebar-close');
  if (sidebarClose) {
    sidebarClose.addEventListener('click', hideSidebar);
  }

  setStatus('msg', 'ready');

  // Drag-drop .plan files
  document.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  document.addEventListener('drop', async e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (file.name.endsWith('.plan') || file.name.endsWith('.json')) {
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        loadProjectData(data);
        PP.fileHandle = null;
        PP.fileName = file.name;
        PP.dirty = false;
        const pname = file.name.replace(/\.\w+$/, '');
        projectCreate(pname);
        startProject();
        setStatus('msg', 'opened ' + file.name);
      } catch (err) {
        setStatus('msg', 'open failed: ' + err.message);
      }
    }
  });

  // Show splash
  showSplash(handleSplashChoice);
})();

function handleSplashChoice(action, arg) {
  switch (action) {
    case 'new':
      PP.tasks = [createTask()];
      PP.fileHandle = null;
      PP.fileName = null;
      PP.dirty = false;
      projectCreate();
      startProject();
      break;

    case 'open':
      openFile();
      break;

    case 'resume': {
      const activeId = localStorage.getItem('pp-active');
      if (activeId) {
        const data = projectLoad(activeId);
        if (data) {
          loadProjectData(data);
          PP.fileHandle = null;
          PP.dirty = false;
          const projects = getProjects();
          const p = projects.find(e => e.id === activeId);
          PP.fileName = p ? p.name : null;
          startProject();
          break;
        }
      }
      // Fallback
      PP.tasks = STARTER_TASKS.map(t => createTask(t));
      projectCreate();
      startProject();
      break;
    }

    case 'load': {
      const data = projectLoad(arg);
      if (data) {
        loadProjectData(data);
        PP.fileHandle = null;
        PP.dirty = false;
        const projects = getProjects();
        const p = projects.find(e => e.id === arg);
        PP.fileName = p ? p.name : null;
        startProject();
      }
      break;
    }

    case 'example': {
      const ex = EXAMPLES[arg];
      if (ex) {
        PP.tasks = ex.tasks.map(t => createTask(t));
        PP.templates = (ex.templates || []).map(t => ({
          ...createTemplate(t),
          tasks: (t.tasks || []).map(tt => createTemplateTask(tt)),
        }));
        PP.projectStart = ex.projectStart || new Date().toISOString().slice(0, 10);
        PP.deadlines = ex.deadlines || [];
        PP.fileHandle = null;
        PP.fileName = null;
        PP.dirty = false;
        projectCreate(arg);
        startProject();
      }
      break;
    }
  }
}

// Automation handle (committed smoke: test/plan-smoke.mjs) — the micro/lamina pattern
window._plan = { PP, COLUMNS, evaluate, scheduleEval, newFile, loadProjectData, serializeProject, openExample: (name) => handleSplashChoice('example', name), showEVMPanel, showHealthPanel, runMonteCarlo, toggleTaskWindow, toggleTemplateWindow, exportScheduleCSV, exportGanttSVG, importTasksFromText, importCSVDialog };
