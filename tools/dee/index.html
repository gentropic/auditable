// -- csv.js --

// dee tool — CSV parser for block models and drillholes

function detectSeparator(text) {
  const first = text.slice(0, text.indexOf('\n') || 200);
  const counts = { ',': 0, '\t': 0, ';': 0 };
  for (const ch of first) if (ch in counts) counts[ch]++;
  return counts['\t'] > counts[','] ? '\t' : counts[';'] > counts[','] ? ';' : ',';
}

function parseCSV(text) {
  const sep = detectSeparator(text);
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(sep).map(h => h.trim().replace(/^["']|["']$/g, ''));
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split(sep);
    if (parts.length < headers.length) continue;
    const row = {};
    for (let j = 0; j < headers.length; j++) {
      const v = parts[j]?.trim().replace(/^["']|["']$/g, '');
      row[headers[j]] = v;
    }
    rows.push(row);
  }
  return { headers, rows };
}

function findColumn(headers, ...candidates) {
  const lower = headers.map(h => h.toLowerCase());
  for (const c of candidates) {
    const idx = lower.indexOf(c.toLowerCase());
    if (idx >= 0) return headers[idx];
  }
  return null;
}

function inferGridDef(xs, ys, zs) {
  // sort unique values per axis, find spacing
  const unique = arr => [...new Set(arr)].sort((a, b) => a - b);
  const ux = unique(xs), uy = unique(ys), uz = unique(zs);
  const spacing = arr => {
    if (arr.length < 2) return 1;
    const diffs = [];
    for (let i = 1; i < arr.length; i++) diffs.push(arr[i] - arr[i - 1]);
    diffs.sort((a, b) => a - b);
    return diffs[Math.floor(diffs.length / 2)]; // median spacing
  };
  const sx = spacing(ux), sy = spacing(uy), sz = spacing(uz);
  const nx = ux.length, ny = uy.length, nz = uz.length;
  // origin = centroid of first block
  return {
    origin: [ux[0], uy[0], uz[0]],
    size: [sx, sy, sz],
    count: [nx, ny, nz],
  };
}

function parseBlockCSV(text) {
  const { headers, rows } = parseCSV(text);
  const xCol = findColumn(headers, 'x', 'east', 'easting', 'centroid_x', 'xc');
  const yCol = findColumn(headers, 'y', 'north', 'northing', 'centroid_y', 'yc');
  const zCol = findColumn(headers, 'z', 'elev', 'elevation', 'rl', 'centroid_z', 'zc');
  if (!xCol || !yCol || !zCol) throw new Error(`Cannot find x/y/z columns in: ${headers.join(', ')}`);

  const xs = rows.map(r => parseFloat(r[xCol]));
  const ys = rows.map(r => parseFloat(r[yCol]));
  const zs = rows.map(r => parseFloat(r[zCol]));

  const gridDef = inferGridDef(xs, ys, zs);
  const n = _grid.nBlocks(gridDef);

  // numeric columns (excluding x/y/z)
  const skip = new Set([xCol, yCol, zCol]);
  const columnNames = headers.filter(h => !skip.has(h) && rows.some(r => !isNaN(parseFloat(r[h]))));

  const columns = {};
  for (const col of columnNames) {
    const indices = [], values = [];
    for (let i = 0; i < rows.length; i++) {
      const v = parseFloat(rows[i][col]);
      if (isNaN(v)) continue;
      const idx = _grid.locate(gridDef, xs[i], ys[i], zs[i]);
      if (idx >= 0) { indices.push(idx); values.push(v); }
    }
    columns[col] = { values: new Float64Array(values), indices: new Int32Array(indices) };
  }

  return { gridDef, columns, columnNames };
}

function parseDrillholeCSV(collarText, intervalText) {
  const collar = parseCSV(collarText);
  const intervals = parseCSV(intervalText);

  const idCol = findColumn(collar.headers, 'hole_id', 'holeid', 'id', 'bhid', 'dhid');
  const eCol = findColumn(collar.headers, 'east', 'easting', 'x', 'collar_x');
  const nCol = findColumn(collar.headers, 'north', 'northing', 'y', 'collar_y');
  const zCol = findColumn(collar.headers, 'elev', 'elevation', 'z', 'collar_z', 'rl');
  if (!idCol || !eCol || !nCol || !zCol) throw new Error('Cannot find collar columns');

  const iIdCol = findColumn(intervals.headers, 'hole_id', 'holeid', 'id', 'bhid', 'dhid');
  const fromCol = findColumn(intervals.headers, 'from', 'from_m', 'depth_from');
  const toCol = findColumn(intervals.headers, 'to', 'to_m', 'depth_to');
  if (!iIdCol || !fromCol || !toCol) throw new Error('Cannot find interval columns');

  // find grade columns (numeric, not from/to)
  const skip = new Set([iIdCol, fromCol, toCol]);
  const gradeCol = intervals.headers.find(h => !skip.has(h) && intervals.rows.some(r => !isNaN(parseFloat(r[h]))));

  const collarMap = {};
  for (const r of collar.rows) {
    collarMap[r[idCol]] = {
      id: r[idCol],
      collar: [parseFloat(r[eCol]), parseFloat(r[nCol]), parseFloat(r[zCol])],
      surveys: [{ depth: 0, azimuth: 0, dip: -90 }],
      intervals: [],
    };
  }

  for (const r of intervals.rows) {
    const hole = collarMap[r[iIdCol]];
    if (!hole) continue;
    const iv = { from: parseFloat(r[fromCol]), to: parseFloat(r[toCol]) };
    if (gradeCol) iv.value = parseFloat(r[gradeCol]);
    hole.intervals.push(iv);
  }

  return { holes: Object.values(collarMap).filter(h => h.intervals.length > 0) };
}

// -- synthetic.js --

// dee tool — synthetic block model generator (no GSLIB dependency)

// seeded PRNG (xoshiro128**)
function _rng(seed) {
  let s = [seed >>> 0, (seed * 0x6C078965 + 1) >>> 0, (seed * 0x5D588B65 + 1) >>> 0, (seed * 0x9908B0DF + 1) >>> 0];
  return function() {
    const r = (Math.imul(s[1], 5) << 7 | Math.imul(s[1], 5) >>> 25) * 9;
    const t = s[1] << 9;
    s[2] ^= s[0]; s[3] ^= s[1]; s[1] ^= s[2]; s[0] ^= s[3];
    s[2] ^= t; s[3] = (s[3] << 11) | (s[3] >>> 21);
    return (r >>> 0) / 4294967296;
  };
}

// 3D value noise with interpolation
function _noise3d(rand, nx, ny, nz) {
  // generate random field then smooth
  const n = nx * ny * nz;
  const raw = new Float64Array(n);
  for (let i = 0; i < n; i++) raw[i] = rand() * 2 - 1;

  // box filter smoothing (3 passes for approximate Gaussian)
  function smooth(arr) {
    const out = new Float64Array(n);
    for (let k = 0; k < nz; k++) {
      for (let j = 0; j < ny; j++) {
        for (let i = 0; i < nx; i++) {
          let sum = 0, c = 0;
          for (let dk = -1; dk <= 1; dk++) {
            for (let dj = -1; dj <= 1; dj++) {
              for (let di = -1; di <= 1; di++) {
                const ii = i + di, jj = j + dj, kk = k + dk;
                if (ii >= 0 && ii < nx && jj >= 0 && jj < ny && kk >= 0 && kk < nz) {
                  sum += arr[ii + jj * nx + kk * nx * ny];
                  c++;
                }
              }
            }
          }
          out[i + j * nx + k * nx * ny] = sum / c;
        }
      }
    }
    return out;
  }

  let field = raw;
  for (let pass = 0; pass < 3; pass++) field = smooth(field);
  return field;
}

function generateSynthetic(opts = {}) {
  const preset = PRESETS[opts.size] || PRESETS.medium;
  const { nx, ny, nz } = preset;
  const n = nx * ny * nz;
  const seed = opts.seed || 42;
  const blockSize = opts.blockSize || [10, 10, (nz > 30 ? 5 : 10)];
  const rand = _rng(seed);

  const gridDef = {
    origin: [650000, 7200000, -nz * blockSize[2] / 2],
    size: blockSize,
    count: [nx, ny, nz],
  };

  // base field with spatial correlation
  const field = _noise3d(rand, nx, ny, nz);

  // optional enrichment zone (ellipsoidal high-grade core)
  const cx = nx / 2, cy = ny / 2, cz = nz / 2;
  const values = new Float64Array(n);
  const indices = new Int32Array(n);
  let count = 0;

  for (let k = 0; k < nz; k++) {
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        const idx = i + j * nx + k * nx * ny;
        // distance from center (normalized)
        const di = (i - cx) / (nx * 0.35);
        const dj = (j - cy) / (ny * 0.35);
        const dk = (k - cz) / (nz * 0.4);
        const r2 = di * di + dj * dj + dk * dk;
        // enrichment: high grade near center
        const enrichment = Math.max(0, 3.0 * (1 - r2));
        // base grade + enrichment + noise
        const grade = Math.max(1, field[idx] * 8 + 25 + enrichment);
        values[count] = grade;
        indices[count] = idx;
        count++;
      }
    }
  }

  const compactVar = { values: values.slice(0, count), indices: indices.slice(0, count) };

  // synthetic drillholes
  const drillholes = [];
  const spacing = Math.max(3, Math.floor(nx / 6));
  let holeId = 0;
  for (let dj = 2; dj < ny; dj += spacing) {
    for (let di = 2; di < nx; di += spacing) {
      const hx = gridDef.origin[0] + di * blockSize[0];
      const hy = gridDef.origin[1] + dj * blockSize[1];
      const collar = [hx, hy, gridDef.origin[2] + (nz - 1) * blockSize[2]];
      const intervals = [];
      for (let k = nz - 1; k >= 0; k--) {
        const idx = di + dj * nx + k * nx * ny;
        const depth = (nz - 1 - k) * blockSize[2];
        intervals.push({ from: depth, to: depth + blockSize[2], value: values[idx] });
      }
      holeId++;
      drillholes.push({
        id: `DDH-${String(holeId).padStart(3, '0')}`,
        collar,
        surveys: [{ depth: 0, azimuth: 0, dip: -90 }],
        intervals,
      });
    }
  }

  return { gridDef, compactVar, drillholes, columnNames: ['grade'], columns: { grade: compactVar } };
}

// -- scene.js --

// dee tool — 3D scene lifecycle

async function loadThreeJS() {
  const THREE = await import('https://esm.sh/three@0.170.0');
  const { OrbitControls } = await import('https://esm.sh/three@0.170.0/examples/jsm/controls/OrbitControls.js');
  globalThis.THREE = THREE;
  globalThis.OrbitControls = OrbitControls;
  return THREE;
}

function initScene() {
  const container = $('#d3-viewport');
  D3.container = container;
  D3.scene = create(container, { THREE: globalThis.THREE, origin: [0, 0, 0] });
  // expose grid functions for raycaster
  window._gcu_grid = { locate: _grid.locate, ijk: _grid.ijk };
  D3.scene.raycast.enablePicking({ grid: window._gcu_grid });
}

function loadBlockModel(gridDef, compactVar, columnName) {
  // remove existing block layer
  if (D3.blockLayer) { D3.scene.removeLayer('blocks'); D3.blockLayer = null; }

  D3.gridDef = gridDef;
  D3.activeColumn = columnName;

  // update scene origin to grid center
  const bb = _grid.boundingBox(gridDef);
  D3.scene.origin[0] = (bb.min[0] + bb.max[0]) / 2;
  D3.scene.origin[1] = (bb.min[1] + bb.max[1]) / 2;
  D3.scene.origin[2] = (bb.min[2] + bb.max[2]) / 2;

  // mesh
  const t0 = performance.now();
  const hint = Math.max(16, Math.min(64, Math.ceil(Math.max(gridDef.count[0], gridDef.count[1], gridDef.count[2]) / 4)));
  D3.prepared = _voxmesh.prepare(gridDef, compactVar, { count: D3.binCount, hint });
  D3.breaks = D3.prepared.breaks;
  D3.perf.meshTime = performance.now() - t0;

  // count triangles
  let tris = 0;
  for (const [_, m] of D3.prepared.meshes) tris += m.indices.length / 3;
  D3.perf.triangles = tris;
  D3.perf.blocks = compactVar.indices.length;

  // color map
  const cmap = colorMap({ breaks: D3.prepared.breaks, palette: D3.palette });
  D3.blockLayer = D3.scene.addBlockModel('blocks', D3.prepared.meshes, {
    colorMap: cmap, gridDef, compactVar,
  });

  // bounding box + fit
  D3.scene.hud.boundingBox(_grid.boundingBox(gridDef));
  D3.scene.controls.fitAll();

  updatePerf();
  updateStatus();
}

function loadDrillholes(holes) {
  if (D3.holeLayer) { D3.scene.removeLayer('holes'); D3.holeLayer = null; }
  D3.drillholes = holes;
  if (!holes.length || !D3.scene) return;

  const cmap = D3.prepared ? colorMap({ breaks: D3.prepared.breaks, palette: D3.palette }) : null;
  D3.holeLayer = D3.scene.addDrillholes('holes', { holes, colorMap: cmap, radius: Math.min(D3.gridDef.size[0], D3.gridDef.size[1]) * 0.15 });
  D3.scene.markDirty();
}

function updateCutoff(value) {
  if (!D3.prepared || !D3.gridDef) return;
  D3.cutoff = value;

  const cv = D3.columns[D3.activeColumn];
  if (!cv) return;

  let compactVar;
  if (value === null) {
    compactVar = cv;
  } else {
    const aboveMask = _grid.maskAboveValue(cv.values, value);
    const aboveLocal = _grid.maskToIndices(aboveMask);
    compactVar = {
      values: _grid.take(cv.values, aboveLocal),
      indices: _grid.take(cv.indices, aboveLocal),
    };
  }

  const t0 = performance.now();
  const hint = Math.max(16, Math.min(64, Math.ceil(Math.max(D3.gridDef.count[0], D3.gridDef.count[1], D3.gridDef.count[2]) / 4)));
  // use same breaks as the full model so colors stay consistent
  const prepared = _voxmesh.prepare(D3.gridDef, compactVar, { breaks: D3.breaks, hint });
  D3.perf.meshTime = performance.now() - t0;

  let tris = 0;
  for (const [_, m] of prepared.meshes) tris += m.indices.length / 3;
  D3.perf.triangles = tris;
  D3.perf.blocks = compactVar.indices.length;

  D3.blockLayer.replaceAll(prepared.meshes);
  D3.scene.markDirty();
  updatePerf();
  updateStatus();
}

function updatePalette(name) {
  D3.palette = name;
  // rebuild with new palette
  if (D3.gridDef && D3.columns[D3.activeColumn]) {
    loadBlockModel(D3.gridDef, D3.columns[D3.activeColumn], D3.activeColumn);
  }
}

function switchColumn(name) {
  if (!D3.columns[name]) return;
  D3.cutoff = null;
  loadBlockModel(D3.gridDef, D3.columns[name], name);
}

function teardownScene() {
  if (D3.scene) { D3.scene.dispose(); D3.scene = null; }
  D3.blockLayer = null;
  D3.holeLayer = null;
  D3.prepared = null;
  D3.sectionMode = false;
  D3.sectionClip = null;
  D3.sectionLayer = null;
}

function toggleWireframe() {
  if (!D3.scene) return;
  D3.scene.scene.traverse(obj => {
    if (obj.isMesh && obj.material && !obj._isHighlight) {
      obj.material.wireframe = !obj.material.wireframe;
    }
  });
  D3.scene.markDirty();
}

function _getCurrentCompactVar() {
  const cv = D3.columns[D3.activeColumn];
  if (!cv) return null;
  if (D3.cutoff === null) return cv;
  const aboveMask = _grid.maskAboveValue(cv.values, D3.cutoff);
  const aboveLocal = _grid.maskToIndices(aboveMask);
  return {
    values: _grid.take(cv.values, aboveLocal),
    indices: _grid.take(cv.indices, aboveLocal),
  };
}

// ── section plane via click-drag ──

function enterSectionMode() {
  if (!D3.scene) return;
  D3.sectionMode = true;
  const vp = $('#d3-viewport');
  if (vp) vp.style.cursor = 'crosshair';
  // disable orbit controls during section draw
  if (D3.scene?.controls._controls) D3.scene.controls._controls.enabled = false;
  updateStatus();
  const msg = $('#d3-status-msg');
  if (msg) msg.textContent = 'click and drag to define section plane';
}

function exitSectionMode() {
  D3.sectionMode = false;
  const vp = $('#d3-viewport');
  if (vp) vp.style.cursor = '';
  if (D3.scene?.controls._controls) D3.scene.controls._controls.enabled = true;
  updateStatus();
}

function clearSection() {
  if (D3.sectionClip) { D3.sectionClip.remove(); D3.sectionClip = null; }
  if (D3.sectionLayer) { D3.scene.removeLayer('section'); D3.sectionLayer = null; }
  if (D3.scene) D3.scene._sectionPlane = null;
  D3.scene?.markDirty();
}

function initSectionDrag() {
  const canvas = $('#d3-viewport');
  if (!canvas) return;
  let startX = null, startY = null;
  let lineEl = null;

  canvas.addEventListener('mousedown', (e) => {
    if (!D3.sectionMode || e.button !== 0) return;
    startX = e.offsetX; startY = e.offsetY;
    // create drag line overlay
    lineEl = document.createElement('div');
    lineEl.className = 'd3-section-line';
    lineEl.style.cssText = `position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20;`;
    canvas.appendChild(lineEl);
  });

  canvas.addEventListener('mousemove', (e) => {
    if (!D3.sectionMode || startX === null || !lineEl) return;
    // draw SVG line
    const w = canvas.clientWidth, h = canvas.clientHeight;
    lineEl.innerHTML = `<svg width="${w}" height="${h}" style="position:absolute;top:0;left:0">
      <line x1="${startX}" y1="${startY}" x2="${e.offsetX}" y2="${e.offsetY}" stroke="#c89b3c" stroke-width="2" stroke-dasharray="6,4"/>
    </svg>`;
  });

  canvas.addEventListener('mouseup', (e) => {
    if (!D3.sectionMode || startX === null) return;
    const endX = e.offsetX, endY = e.offsetY;
    if (lineEl) { lineEl.remove(); lineEl = null; }

    // need minimum drag distance
    const dx = endX - startX, dy = endY - startY;
    if (dx * dx + dy * dy < 100) { startX = null; return; }

    // compute section plane from the two screen points + camera
    applySection(startX, startY, endX, endY);
    startX = null;
    exitSectionMode();
  });
}

function applySection(x1, y1, x2, y2) {
  if (!D3.scene || !D3.gridDef) return;
  const THREE = globalThis.THREE;
  const camera = D3.scene.camera;
  const vp = $('#d3-viewport');
  const w = vp.clientWidth, h = vp.clientHeight;

  // three points define the plane: camera + two unprojected screen points
  const a = new THREE.Vector3((x1 / w) * 2 - 1, -(y1 / h) * 2 + 1, 0.5).unproject(camera);
  const b = new THREE.Vector3((x2 / w) * 2 - 1, -(y2 / h) * 2 + 1, 0.5).unproject(camera);
  const c = camera.position;

  const ca = a.clone().sub(c);
  const cb = b.clone().sub(c);
  const normal = ca.clone().cross(cb).normalize();
  if (normal.lengthSq() < 0.001) return;

  // clear previous
  clearSection();

  // clip plane in world space
  const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, c);

  clearSection();
  D3.scene.clippingPlanes.push(plane);

  // section fill: use the same filtered data as the current view
  const cv = _getCurrentCompactVar();
  if (cv && D3.prepared) {
    const invScene = new THREE.Matrix4().copy(D3.scene.scene.matrixWorld).invert();
    const normMat = new THREE.Matrix3().getNormalMatrix(invScene);

    // transform midpoint of drag to geological coords
    const midWorld = a.clone().add(b).multiplyScalar(0.5);
    const midGeo = midWorld.clone().applyMatrix4(invScene);
    const normalGeo = normal.clone().applyMatrix3(normMat).normalize();

    const geoPoint = [midGeo.x + D3.scene.origin[0], midGeo.y + D3.scene.origin[1], midGeo.z + D3.scene.origin[2]];
    const geoNormal = [normalGeo.x, normalGeo.y, normalGeo.z];

    const binIds = _voxmesh.discretize(cv.values, D3.breaks);
    const sectionMesh = _voxmesh.meshSection(D3.gridDef, cv, binIds, { point: geoPoint, normal: geoNormal });
    if (sectionMesh.positions.length > 0) {
      const cmap = colorMap({ breaks: D3.breaks, palette: D3.palette });
      D3.sectionLayer = D3.scene.addSection('section', sectionMesh, { colorMap: cmap, pickable: false });

      // store plane on dee for ray-plane picking (no mesh needed)
      D3.scene._sectionPlane = plane;
    }
  }

  D3.scene.markDirty();

  D3.sectionClip = {
    plane,
    remove() {
      const idx = D3.scene.clippingPlanes.indexOf(plane);
      if (idx >= 0) D3.scene.clippingPlanes.splice(idx, 1);
      D3.scene.markDirty();
    },
    flip() { plane.negate(); D3.scene.markDirty(); },
  };
}

// -- perf.js --

// dee tool — performance dashboard

function updatePerf() {
  const el = $('#d3-perf');
  if (!el) return;
  const p = D3.perf;
  el.textContent = `FPS: ${p.fps} | blocks: ${p.blocks.toLocaleString()} | tris: ${p.triangles.toLocaleString()} | mesh: ${p.meshTime.toFixed(0)}ms`;
}

function startFPSCounter() {
  let frames = 0, lastTime = performance.now();
  if (D3.scene) {
    D3.scene.onAfterRender(() => {
      frames++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        D3.perf.fps = frames;
        frames = 0;
        lastTime = now;
        updatePerf();
      }
    });
  }
}

function updateStatus() {
  const msg = $('#d3-status-msg');
  const blocks = $('#d3-status-blocks');
  const col = $('#d3-status-column');
  if (msg && D3.fileName) msg.textContent = D3.fileName;
  if (blocks && D3.gridDef) {
    const n = _grid.nBlocks(D3.gridDef);
    blocks.textContent = `${D3.gridDef.count.join('×')} = ${n.toLocaleString()} blocks`;
  }
  if (col && D3.activeColumn) col.textContent = D3.activeColumn;
}

// -- menu.js --

// dee tool — menu bar

function initMenuBar() {
  const bar = $('#d3-menubar');
  if (!bar) return;
  bar.innerHTML = '';

  const menus = [
    { label: 'File', items: [
      { label: 'New', action: newProject, shortcut: 'Ctrl+N' },
      { label: 'Open Block Model CSV\u2026', action: openBlockCSV, shortcut: 'Ctrl+O' },
      { label: 'Open Drillholes\u2026', action: openDrillholeCSV },
      { type: 'sep' },
      { label: 'Export Screenshot', action: exportScreenshot, shortcut: 'Ctrl+Shift+S' },
    ]},
    { label: 'View', items: [
      { label: 'Perspective', action: () => D3.scene?.controls.fitAll(), shortcut: '1' },
      { label: 'Plan View', action: () => D3.scene?.controls.planView(), shortcut: '2' },
      { label: 'Section North', action: () => D3.scene?.controls.sectionNorth(), shortcut: '3' },
      { label: 'Section East', action: () => D3.scene?.controls.sectionEast(), shortcut: '4' },
      { type: 'sep' },
      { label: 'Toggle Sidebar', action: toggleSidebar, shortcut: 'Tab' },
      { label: 'Toggle Wireframe', action: toggleWireframe, shortcut: 'W' },
    ]},
    { label: 'Tools', items: [
      { label: 'Generate: Small (4K)', action: () => generateAndLoad('small') },
      { label: 'Generate: Medium (50K)', action: () => generateAndLoad('medium') },
      { label: 'Generate: Large (300K)', action: () => generateAndLoad('large') },
      { label: 'Generate: Stress (2M)', action: () => generateAndLoad('stress') },
      { type: 'sep' },
      { label: 'Draw Section Plane', action: enterSectionMode, shortcut: 'S' },
      { label: 'Clear Section', action: clearSection },
    ]},
    { label: 'Help', items: [
      { label: 'Keyboard Shortcuts', action: showShortcuts },
      { label: 'About', action: showAbout },
    ]},
  ];

  for (const menu of menus) {
    const item = document.createElement('div');
    item.className = 'd3-menu-item';
    item.textContent = menu.label;
    const dropdown = document.createElement('div');
    dropdown.className = 'd3-dropdown';
    for (const entry of menu.items) {
      if (entry.type === 'sep') { const s = document.createElement('div'); s.className = 'd3-sep'; dropdown.appendChild(s); continue; }
      const row = document.createElement('div');
      row.className = 'd3-dropdown-item';
      row.innerHTML = `<span>${entry.label}</span>${entry.shortcut ? `<span class="d3-shortcut">${entry.shortcut}</span>` : ''}`;
      row.onclick = () => { closeMenus(); entry.action(); };
      dropdown.appendChild(row);
    }
    item.appendChild(dropdown);
    item.onclick = (e) => {
      if (e.target === item) {
        const open = item.classList.contains('open');
        closeMenus();
        if (!open) item.classList.add('open');
      }
    };
    bar.appendChild(item);
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.d3-menu-item')) closeMenus();
  });
}

function closeMenus() {
  $$('.d3-menu-item.open').forEach(m => m.classList.remove('open'));
}

function toggleSidebar() {
  const sb = $('#d3-sidebar');
  if (!sb) return;
  D3.sidebarOpen = !D3.sidebarOpen;
  sb.classList.toggle('hidden', !D3.sidebarOpen);
  D3.scene?.resize();
}

function buildSidebar() {
  const content = $('#d3-sidebar-content');
  if (!content) return;
  content.innerHTML = '';

  // column selector
  if (D3.columnNames.length > 1) {
    const label = document.createElement('label');
    label.textContent = 'Column:';
    label.className = 'd3-label';
    const sel = document.createElement('select');
    sel.className = 'd3-select';
    for (const name of D3.columnNames) {
      const opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      if (name === D3.activeColumn) opt.selected = true;
      sel.appendChild(opt);
    }
    sel.onchange = () => switchColumn(sel.value);
    content.appendChild(label);
    content.appendChild(sel);
  }

  // cutoff slider
  if (D3.columns[D3.activeColumn]) {
    const cv = D3.columns[D3.activeColumn];
    const s = _grid.stats(cv.values);
    const label = document.createElement('label');
    label.className = 'd3-label';
    label.textContent = 'Cutoff:';
    const row = document.createElement('div');
    row.className = 'd3-slider-row';
    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = s.min; slider.max = s.max; slider.step = (s.max - s.min) / 100;
    slider.value = D3.cutoff ?? s.min;
    slider.className = 'd3-slider';
    const val = document.createElement('span');
    val.className = 'd3-slider-val';
    val.textContent = D3.cutoff != null ? D3.cutoff.toFixed(1) : 'off';
    const btn = document.createElement('button');
    btn.textContent = 'Show All';
    btn.className = 'd3-btn-small';
    btn.onclick = () => { D3.cutoff = null; val.textContent = 'off'; updateCutoff(null); };
    slider.oninput = () => {
      const v = parseFloat(slider.value);
      val.textContent = v.toFixed(1);
      updateCutoff(v);
    };
    content.appendChild(label);
    row.appendChild(slider); row.appendChild(val);
    content.appendChild(row);
    content.appendChild(btn);
  }

  // palette
  const pLabel = document.createElement('label');
  pLabel.className = 'd3-label';
  pLabel.textContent = 'Palette:';
  content.appendChild(pLabel);
  for (const p of PALETTES) {
    const btn = document.createElement('button');
    btn.textContent = p;
    btn.className = 'd3-btn-small' + (p === D3.palette ? ' active' : '');
    btn.onclick = () => { updatePalette(p); buildSidebar(); };
    content.appendChild(btn);
  }
}

function generateAndLoad(size) {
  const loader = $('#d3-loader');
  if (loader) { loader.classList.remove('hidden'); loader.textContent = `generating ${size} model\u2026`; }

  setTimeout(() => {
    const result = generateSynthetic({ size, seed: Math.floor(Math.random() * 9999) });
    D3.columns = result.columns;
    D3.columnNames = result.columnNames;
    D3.fileName = `synthetic-${size}`;
    D3.dirty = false;

    if (!D3.scene) initScene();
    loadBlockModel(result.gridDef, result.compactVar, result.columnNames[0]);
    loadDrillholes(result.drillholes);
    startFPSCounter();
    buildSidebar();

    if (loader) loader.classList.add('hidden');
  }, 50);
}

function showShortcuts() {
  alert('1: Perspective  2: Plan  3: Section N  4: Section E\nTab: Toggle sidebar\nCtrl+O: Open CSV\nCtrl+Shift+S: Screenshot');
}

function showAbout() {
  alert('dee \u2014 3D block model viewer\nPart of the Auditable project\nhttps://github.com/gentropic/auditable');
}

// -- file.js --

// dee tool — file operations

async function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    if (accept) input.accept = accept;
    input.onchange = () => resolve(input.files[0] || null);
    input.click();
  });
}

async function openBlockCSV() {
  const file = await pickFile('.csv,.txt');
  if (!file) return;
  const text = await file.text();
  try {
    const result = parseBlockCSV(text);
    D3.columns = result.columns;
    D3.columnNames = result.columnNames;
    D3.fileName = file.name;
    D3.dirty = false;

    if (!D3.scene) initScene();
    loadBlockModel(result.gridDef, result.columns[result.columnNames[0]], result.columnNames[0]);
    startFPSCounter();
    buildSidebar();
  } catch (e) {
    alert('Error parsing CSV: ' + e.message);
  }
}

async function openDrillholeCSV() {
  const collarFile = await pickFile('.csv,.txt');
  if (!collarFile) return;
  const intervalFile = await pickFile('.csv,.txt');
  if (!intervalFile) return;
  try {
    const collarText = await collarFile.text();
    const intervalText = await intervalFile.text();
    const { holes } = parseDrillholeCSV(collarText, intervalText);
    loadDrillholes(holes);
  } catch (e) {
    alert('Error parsing drillhole CSV: ' + e.message);
  }
}

function newProject() {
  teardownScene();
  D3.gridDef = null;
  D3.columns = {};
  D3.columnNames = [];
  D3.activeColumn = null;
  D3.drillholes = [];
  D3.fileName = null;
  D3.cutoff = null;
  showSplash();
}

async function exportScreenshot() {
  if (!D3.scene) return;
  const blob = await D3.scene.screenshot();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (D3.fileName || 'dee') + '.png';
  a.click();
  URL.revokeObjectURL(url);
}

// -- splash.js --

// dee tool — splash screen

function showSplash() {
  let overlay = $('#d3-splash');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'd3-splash';
    overlay.className = 'd3-splash';
    document.body.appendChild(overlay);
  }
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="d3-splash-inner">
      <h1 class="d3-splash-title">d e e</h1>
      <p class="d3-splash-sub">3D block model viewer</p>
      <div class="d3-splash-actions">
        <button class="d3-btn" id="d3-splash-open">open CSV\u2026</button>
        <button class="d3-btn" id="d3-splash-small">small (4K)</button>
        <button class="d3-btn" id="d3-splash-medium">medium (50K)</button>
        <button class="d3-btn" id="d3-splash-large">large (300K)</button>
        <button class="d3-btn d3-btn-dim" id="d3-splash-stress">stress (2M)</button>
      </div>
    </div>
  `;

  $('#d3-splash-open').onclick = () => { closeSplash(); openBlockCSV(); };
  $('#d3-splash-small').onclick = () => { closeSplash(); generateAndLoad('small'); };
  $('#d3-splash-medium').onclick = () => { closeSplash(); generateAndLoad('medium'); };
  $('#d3-splash-large').onclick = () => { closeSplash(); generateAndLoad('large'); };
  $('#d3-splash-stress').onclick = () => { closeSplash(); generateAndLoad('stress'); };
}

function closeSplash() {
  const overlay = $('#d3-splash');
  if (overlay) overlay.classList.add('hidden');
}

// -- init.js --

// dee tool — bootstrap

;(async function init() {
  const loader = $('#d3-loader');

  // load Three.js from CDN
  try {
    if (loader) loader.textContent = 'loading Three.js\u2026';
    await loadThreeJS();
    if (loader) loader.classList.add('hidden');
  } catch (e) {
    if (loader) loader.textContent = 'failed to load Three.js: ' + e.message;
    return;
  }

  // keyboard shortcuts
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'S') { e.preventDefault(); exportScreenshot(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'o') { e.preventDefault(); openBlockCSV(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); newProject(); return; }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === '1') { D3.scene?.controls.fitAll(); D3.scene?.markDirty(); }
    if (e.key === '2') { D3.scene?.controls.planView(); D3.scene?.markDirty(); }
    if (e.key === '3') { D3.scene?.controls.sectionNorth(); D3.scene?.markDirty(); }
    if (e.key === '4') { D3.scene?.controls.sectionEast(); D3.scene?.markDirty(); }
    if (e.key === 'Tab') { e.preventDefault(); toggleSidebar(); }
    if (e.key === 's' || e.key === 'S') { if (!e.ctrlKey && !e.metaKey) enterSectionMode(); }
    if (e.key === 'w' || e.key === 'W') { if (!e.ctrlKey && !e.metaKey) toggleWireframe(); }
    if (e.key === 'Escape') { if (D3.sectionMode) exitSectionMode(); }
  });

  // dirty check
  window.addEventListener('beforeunload', e => {
    if (D3.dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  // drag-drop
  document.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  document.addEventListener('drop', async e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (!file) return;
    if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
      closeSplash();
      const text = await file.text();
      try {
        const result = parseBlockCSV(text);
        D3.columns = result.columns;
        D3.columnNames = result.columnNames;
        D3.fileName = file.name;
        if (!D3.scene) initScene();
        loadBlockModel(result.gridDef, result.columns[result.columnNames[0]], result.columnNames[0]);
        startFPSCounter();
        buildSidebar();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  });

  // service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // section drag interaction
  initSectionDrag();

  // menu bar
  initMenuBar();

  // splash
  showSplash();
})();
</script>
