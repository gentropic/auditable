<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gnsslog — raw GNSS logger</title>
<script type="importmap">
{ "imports": {
  "@gcu/leadacid": "../../ext/leadacid/index.js"
} }
</script>
<!-- dev bench: load with ?bench to run shell-style on the desktop (mocks /native). Stripped at build. -->
<script src="../../ext/leadacid/bench.js"></script>
<style>
  :root {
    color-scheme: dark;
    /* Switchboard (ext/switchboard/SPEC.md) — layer 1, the swatches. A dark-only
       field tool: the basalt register lives on :root rather than [data-theme=dark]. */
    --sw-bg-deep:#0E1012; --sw-bg:#15171A; --sw-bg-raised:#1D2024; --sw-bg-bright:#25282D;
    --sw-text:#DDDCDA; --sw-text-mid:#9E9C98; --sw-text-soft:#83817E;
    --sw-border:#2F3338; --sw-border-soft:#24272B; --sw-rule:#3A3E44;
    --sw-orange:#FB9044; --sw-orange-soft:#2E2119; --sw-blue:#008CD1; --sw-blue-soft:#16262F;
    --sw-green:#5CCB80; --sw-green-soft:#1A261D; --sw-yellow:#FFD73A; --sw-yellow-soft:#292317;
    --sw-red:#E75A51; --sw-red-soft:#30201D; --sw-violet:#EC9FFF; --sw-violet-soft:#2A212C;
    --sw-radius:3px; --sw-radius-lg:4px; --sw-tap:44px;
    --sw-mono:"Space Mono","JetBrains Mono","Consolas",monospace; --sw-sans:"Barlow",system-ui,sans-serif;
    /* layer 2 — the semantic tokens the components below read: roles, never hues
       (orange=action · blue=info · green=go · yellow=caution · red=fault · violet=selected) */
    --au-bg:var(--sw-bg); --au-bg-deep:var(--sw-bg-deep); --au-panel:var(--sw-bg-raised); --au-well:var(--sw-bg-bright);
    --au-text:var(--sw-text); --au-text-mid:var(--sw-text-mid); --au-text-soft:var(--sw-text-soft);
    --au-border:var(--sw-border); --au-border-soft:var(--sw-border-soft); --au-rule:var(--sw-rule);
    --au-action:var(--sw-orange); --au-action-soft:var(--sw-orange-soft);
    --au-info:var(--sw-blue); --au-info-soft:var(--sw-blue-soft);
    --au-go:var(--sw-green); --au-go-soft:var(--sw-green-soft);
    --au-caution:var(--sw-yellow); --au-caution-soft:var(--sw-yellow-soft);
    --au-fault:var(--sw-red); --au-fault-soft:var(--sw-red-soft);
    --au-selected:var(--sw-violet); --au-selected-soft:var(--sw-violet-soft);
    --au-mono:var(--sw-mono); --au-sans:var(--sw-sans); --au-tap:var(--sw-tap);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0 auto; max-width:520px;
    padding: calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    background:var(--au-bg); color:var(--au-text); font:15px/1.4 var(--au-sans); }
  h1 { font:600 15px var(--au-mono); margin:0; }
  .top { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .sub { color:var(--au-text-mid); font-size:12px; }
  .strip { display:flex; gap:14px; min-height:16px; margin:0 0 10px; font-size:12px; color:var(--au-text-mid); }
  .strip span:empty { display:none; }
  .sky { position:relative; background:var(--au-panel); border:1px solid var(--au-border); border-radius:14px; padding:10px; }
  .sky svg { display:block; width:100%; height:auto; }
  .sky .lbl { position:absolute; top:10px; right:14px; color:var(--au-text-mid); font-size:10px; text-transform:uppercase; letter-spacing:.06em; text-align:right; line-height:1.3; }
  .cn0 { display:flex; gap:3px; align-items:flex-end; height:46px; margin:10px 2px 2px; }
  .cn0 i { display:block; flex:1; min-width:0; background:var(--au-border); border-radius:2px 2px 0 0; position:relative; }
  .cn0 i.used { background:var(--au-go); }
  .cn0 i b { position:absolute; bottom:-14px; left:0; right:0; text-align:center; font:9px var(--au-mono); color:var(--au-text-mid); font-weight:400; }
  .ctl { margin:22px 0 10px; display:grid; gap:10px; }
  .ctl input[type=text] { width:100%; padding:10px 12px; font:14px var(--au-mono); background:var(--au-panel); color:var(--au-text); border:1px solid var(--au-border); border-radius:9px; }
  .what { display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--au-text-mid); }
  .what label { display:flex; gap:6px; align-items:center; }
  .row { display:flex; gap:10px; align-items:center; }
  button { padding:10px 16px; border:1px solid var(--au-border); background:var(--au-panel); color:var(--au-text); border-radius:9px; font:600 13px var(--au-sans); }
  button:disabled { opacity:.5; }
  button.primary { border-color:var(--au-action); color:var(--au-action); }
  button.stop { border-color:var(--au-fault); color:var(--au-fault); }
  .stat { font:13px var(--au-mono); color:var(--au-text); min-height:18px; }
  .stat.on { color:var(--au-go); }
  .sealed { display:none; background:var(--au-panel); border:1px solid var(--au-border); border-radius:12px; padding:12px 14px; margin-top:10px; }
  .sealed.show { display:block; }
  .sealed b { font:600 13px var(--au-mono); }
  .sealed .row { margin-top:10px; }
  #msg { margin-top:12px; color:var(--au-text-mid); font-size:13px; min-height:18px; }
  #msg.warn { color:var(--au-caution); }
  .vfoot { color:var(--au-text-soft); font-size:10px; margin-top:14px; text-align:right; letter-spacing:.04em; }
</style>
</head>
<body>
<div class="top"><h1>gnsslog</h1><span class="sub" id="brandsub">raw GNSS logger</span></div>
<div class="strip"><span id="fix"></span><span id="sats"></span><span id="engine"></span></div>

<div class="sky">
  <div class="lbl">sky<br>N up · zenith centre</div>
  <svg id="skysvg" viewBox="0 0 300 300" aria-label="satellite sky plot"></svg>
</div>
<div class="cn0" id="cn0"></div>

<div class="ctl">
  <input type="text" id="name" spellcheck="false" aria-label="log name">
  <div class="what">
    <label><input type="checkbox" id="wRaw" checked>raw measurements</label>
    <label><input type="checkbox" id="wLoc" checked>fixes</label>
    <label><input type="checkbox" id="wStatus" checked>satellite status</label>
    <label><input type="checkbox" id="wNmea">NMEA</label>
  </div>
  <div class="row">
    <button id="toggle" class="primary">start logging</button>
    <span class="stat" id="stat"></span>
  </div>
</div>

<div class="sealed" id="sealed">
  <b id="sealedName"></b> <span class="sub" id="sealedInfo"></span>
  <div class="row"><button id="publish" class="primary">publish → Downloads</button><button id="share">share</button></div>
</div>

<div id="msg"></div>
<div class="vfoot">gnsslog · __GNSSLOG_BUILD__</div>

<!-- Import the shell module EARLY so its port listener is registered when the
     shell posts the WebMessagePort (deferred module: before onPageFinished). -->
<script type="module">
import { shell } from '@gcu/leadacid';

const $ = (id) => document.getElementById(id);
const fmtKB = (b) => b < 1024 * 1024 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
function msg(t, warn) { const m = $('msg'); m.textContent = t; m.className = warn ? 'warn' : ''; }

// ── the sky plot + C/N0 bars (from the gnss status stream) ────────────────
const COLORS = { gps: 'var(--sw-orange)', glonass: 'var(--sw-blue)', galileo: 'var(--sw-green)', beidou: 'var(--sw-red)', qzss: 'var(--sw-yellow)', sbas: 'var(--sw-violet)', irnss: 'var(--sw-violet)', unknown: 'var(--sw-text-mid)' };
let lastStatus = null;
function drawSky(st) {
  const svg = $('skysvg'); const cx = 150, cy = 150, R = 136;
  let s = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--au-border)"/>`;
  for (const e of [30, 60]) s += `<circle cx="${cx}" cy="${cy}" r="${R * (90 - e) / 90}" fill="none" stroke="var(--au-border)" stroke-dasharray="3 4"/>`;
  s += `<line x1="${cx}" y1="${cy - R}" x2="${cx}" y2="${cy + R}" stroke="var(--au-border)"/><line x1="${cx - R}" y1="${cy}" x2="${cx + R}" y2="${cy}" stroke="var(--au-border)"/>`;
  for (const [t, x, y] of [['N', cx, 12], ['S', cx, 294], ['E', 292, cy + 4], ['W', 8, cy + 4]]) s += `<text x="${x}" y="${y}" fill="var(--au-text-mid)" font-size="11" text-anchor="middle" font-family="Space Mono,monospace">${t}</text>`;
  for (const sv of (st ? st.satellites : [])) {
    if (sv.elev == null || sv.az == null) continue;
    const rr = R * (90 - Math.max(0, sv.elev)) / 90, a = sv.az * Math.PI / 180;
    const x = cx + rr * Math.sin(a), y = cy - rr * Math.cos(a);
    const r = 3 + Math.max(0, Math.min(1, ((sv.cn0 || 0) - 15) / 35)) * 4;
    const c = COLORS[sv.constellation] || COLORS.unknown;
    s += `<circle class="sat" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${sv.used ? c : 'none'}" stroke="${c}" stroke-width="1.5"><title>${sv.constellation} ${sv.svid} · ${sv.cn0 == null ? '?' : sv.cn0.toFixed(0)} dB-Hz${sv.used ? ' · in fix' : ''}</title></circle>`;
  }
  svg.innerHTML = s;
  const bars = $('cn0'); bars.innerHTML = '';
  for (const sv of (st ? [...st.satellites].sort((a, b) => a.svid - b.svid) : [])) {
    const i = document.createElement('i'); i.className = sv.used ? 'used' : '';
    i.style.height = Math.max(2, Math.min(46, ((sv.cn0 || 0) / 50) * 46)) + 'px';
    i.innerHTML = `<b>${sv.svid}</b>`; i.title = `${sv.constellation} ${sv.svid} · ${sv.cn0 == null ? '?' : sv.cn0.toFixed(0)} dB-Hz`;
    bars.appendChild(i);
  }
  $('sats').textContent = st ? `${st.fixSats}/${st.satellites.length} sats in fix` : '';
}
drawSky(null);

// ── live state from the shell ─────────────────────────────────────────────
let lastFix = null;
const resumeNeeded = { status: false, fix: false };
async function startStatus() {
  try {
    const s = await shell.gnss.status();
    s.on('status', (st) => { lastStatus = st; drawSky(st); });
    s.on('engine', (e) => { $('engine').textContent = e.on ? 'engine on' : 'engine off'; });
    s.on('firstfix', (f) => msg('first fix after ' + (f.ttffMs / 1000).toFixed(1) + ' s'));
    s.onClose(() => { resumeNeeded.status = true; if (!document.hidden) startStatus(); });
  } catch (e) { msg(e.permission && e.permission.canRequest === false ? 'no gnss in this build' : 'location denied — ' + (e.message || e), true); }
}
async function startFix() {
  try {
    const g = await shell.gnss.location({ minMs: 1000 });
    g.on('fix', (f) => { lastFix = f; $('fix').textContent = (f.acc == null ? 'fix' : '±' + f.acc.toFixed(1) + ' m') + (f.last ? ' (last known)' : ''); });
    g.onClose(() => { resumeNeeded.fix = true; if (!document.hidden) startFix(); });
  } catch { /* reported by startStatus */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  if (resumeNeeded.status) { resumeNeeded.status = false; startStatus(); }
  if (resumeNeeded.fix) { resumeNeeded.fix = false; startFix(); }
});

// ── the logger: start / stop / re-attach / publish / share ────────────────
let running = null;          // {name, startedAt}
let sealed = null;           // the last stop() result (+ source)
let lastPublish = null;
let pollTimer = null;
const defaultName = () => { const d = new Date(); const p = (n) => String(n).padStart(2, '0'); return `gnss-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };
$('name').value = defaultName();

function showRunning(st) {
  running = st ? { name: st.name, startedAt: st.startedAt } : null;
  $('toggle').textContent = st ? 'stop' : 'start logging';
  $('toggle').className = st ? 'stop' : 'primary';
  $('name').disabled = !!st;
  for (const id of ['wRaw', 'wLoc', 'wStatus', 'wNmea']) $(id).disabled = !!st;
  if (st) { tick(st); if (!pollTimer) pollTimer = setInterval(poll, 1000); }
  else { clearInterval(pollTimer); pollTimer = null; }
}
function tick(st) {
  const secs = Math.max(0, Math.round((Date.now() - st.startedAt) / 1000));
  const mm = String(Math.floor(secs / 60)).padStart(2, '0'), ss = String(secs % 60).padStart(2, '0');
  $('stat').textContent = `logging · ${st.epochs.toLocaleString()} epochs · ${st.fixes} fixes · ${fmtKB(st.bytes)} · ${mm}:${ss} · ${st.lastFix}`;
  $('stat').className = 'stat on';
}
async function poll() {
  try { const st = await shell.gnss.log.status(); if (st.running) tick(st); else showRunning(null); } catch { /* keep going */ }
}
function showSealed(d) {
  sealed = d;
  $('sealed').classList.add('show');
  $('sealedName').textContent = d.name + '.jsonl';
  $('sealedInfo').textContent = `${d.epochs.toLocaleString()} epochs · ${d.fixes} fixes${d.nmea ? ' · ' + d.nmea + ' NMEA' : ''} · ${fmtKB(d.bytes)}`;
  $('stat').textContent = 'sealed'; $('stat').className = 'stat';
}
async function start() {
  const what = [['wRaw', 'raw'], ['wLoc', 'location'], ['wStatus', 'status'], ['wNmea', 'nmea']].filter(([id]) => $(id).checked).map(([, w]) => w);
  if (!what.length) { msg('pick at least one thing to log', true); return; }
  const name = ($('name').value.trim() || defaultName()).replace(/[^A-Za-z0-9._-]/g, '_');
  try {
    const st = await shell.gnss.log.start({ what, name });
    $('sealed').classList.remove('show');
    showRunning({ ...st, epochs: 0, fixes: 0, bytes: 0, lastFix: 'no fix' });
    msg('logging to ' + name + '.jsonl — the screen can go off');
  } catch (e) {
    if (e.status === 409) { msg('a log is already running (' + (e.info && e.info.holder) + ') — attached to it'); poll(); const st = await shell.gnss.log.status(); if (st.running) showRunning(st); }
    else if (e.status === 403) msg('location denied — the logger needs it', true);
    else msg('could not start: ' + (e.message || e), true);
  }
}
async function stop() {
  try {
    const d = await shell.gnss.log.stop();
    showRunning(null);
    showSealed(d);
    msg('sealed ' + d.name + '.jsonl — publish it to Downloads, or share it');
  } catch (e) { msg('could not stop: ' + (e.message || e), true); }
}
$('toggle').onclick = () => (running ? stop() : start());
$('publish').onclick = async () => {
  if (!sealed) return;
  try {
    const bytes = new Uint8Array(await sealed.source.arrayBuffer());
    const r = await shell.publish(sealed.name + '.jsonl', bytes, { collection: 'Downloads', mime: 'application/x-ndjson' });
    lastPublish = r;
    msg('published ' + sealed.name + '.jsonl (' + fmtKB(bytes.length) + ') → Downloads');
  } catch (e) { msg('publish failed: ' + (e.message || e), true); }
};
$('share').onclick = async () => {
  if (!sealed) return;
  try { await shell.share(sealed.name + '.jsonl', new Uint8Array(await sealed.source.arrayBuffer()), { mime: 'application/x-ndjson' }); }
  catch (e) { msg('share failed: ' + (e.message || e), true); }
};

// ── boot ──────────────────────────────────────────────────────────────────
if (shell.present) {
  startStatus(); startFix();
  // re-attach to a capture that outlived the page (a reload, a return from the launcher)
  shell.gnss.log.status().then((st) => {
    if (st.running) { showRunning(st); msg('re-attached to the running log ' + st.name); }
    else if (st.name && st.token) { showSealed(st); }
  }).catch(() => {});
  msg('ready · start logging, then put the phone away — the capture runs as a foreground service');
} else {
  $('toggle').disabled = true;
  msg('gnsslog needs the lead-acid shell (raw GNSS is a native capability) — open it on the phone, or with ?bench to simulate');
}

// programmatic hooks — the smokes drive through these
window.__gnsslog = {
  shell, get status() { return lastStatus; }, get fix() { return lastFix; }, get running() { return running; },
  get sealed() { return sealed; }, get lastPublish() { return lastPublish; }, start, stop,
};
</script>
</body>
</html>
